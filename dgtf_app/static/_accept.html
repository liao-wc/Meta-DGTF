<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>accept</title>
<style>
  html,body{margin:0;height:100%;background:#0d0f14;color:#7CFC9A;font:12px/1.6 monospace}
  iframe{border:0;width:100vw;height:100vh;display:block}
  #out{position:fixed;left:0;bottom:0;max-width:100vw;max-height:60vh;overflow:auto;
       background:rgba(0,0,0,.92);color:#7CFC9A;padding:10px 12px;white-space:pre-wrap;z-index:99999}
  body.quiet #out{display:none}
</style></head>
<body>
<iframe id="f" src="/"></iframe>
<pre id="out">running…</pre>
<script>
/* 一次性验收台：同源 iframe 里跑真实的 dgtf_app 页面，用真实点击驱动，
   断言结果写进 #out（配合 --dump-dom 读文本），另可截图看视觉。
   m=probe 全量断言 | m=dd 只展开下拉（截图） | m=web 只切联网检索库（截图） */
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
/* ★ 跑法（无头下一条流程太长会挂，拆成两趟 + 一个单独模式）：
     ・`?m=probe&skip=fx`      —— 除⑦（发送/终止）外的全部（布局类判据都在这一趟，四视口跑这个）
     ・`?m=probe&skip=early`    —— 专跑⑦ + ⑤e + ⑥
     ・`?m=resend`              —— 单独验「同一会话内重新发送」（输入框不跳位 + 日志先收后露）
   ★ 为什么不一口气跑：一条流程里起 3~4 个 mock 子进程 + 数百次请求，
     Edge 的虚拟时间会在某个 pending 请求上停住 ⇒ 预算永远到不了、`--dump-dom` 什么都不输出。 */
const MODE = new URLSearchParams(location.search).get('m') || 'probe';
const SKIP = new URLSearchParams(location.search).get('skip') || '';
/* 逗号分隔可叠加多个跳过项（诊断用） */
const SKIPS = new Set(SKIP.split(',').map(x => x.trim()).filter(Boolean));

/* 有些断言只能落在**样式表文本**上（元素此刻不存在，比如任务还在跑时还没有产物链接）。
   取一次 CSS 文本，配一个和 selftest 里 `_rule()` 同款的取规则小助手。 */
let CSS_TXT = '';
let JS_TXT = '';
let HTML_TXT = '';
const cssRule = (sel) => {
  const esc = sel.replace(/\./g, '\\.');
  const m = CSS_TXT.match(new RegExp(esc + '\\s*\\{([^}]*)\\}'));
  return m ? m[1] : '';
};
const R = [];
let EXTRA = '';
const chk = (n, ok, extra) => R.push((ok ? 'PASS ' : 'FAIL ') + n + (extra ? '  | ' + extra : ''));

/* ★ R29：应用改为「刷新回首屏」⇒ 不再自动跟随最新任务。
   验收台要让它把某条任务画出来，就走应用**自己的**会话切换路径（等同点「历史对话」里那一条）。 */
async function showTask(w, id, question) {
  await w.loadExistingTasks();
  if (w.openChat) await w.openChat({ id, question, status: 'running', live: true });
  else { await w.pollLanes(); }
}

async function ready(f) {
  // ★ 每轮重读 f.contentDocument —— iframe 导航后它是**新对象**，先抓的那个是 about:blank
  for (let i = 0; i < 600; i++) {
    const d = f.contentDocument;
    // ★ 仪表盘没有标签页了 —— 判「应用已起来」用**真正的读数行**（`.stat-row`），
    //   不能只看 `#stats-body` 有没有子节点：请求失败时那里会渲染一条错误文案，
    //   子节点数非 0 但读数是空的，会让后面的断言以「0 行」这种误导性方式翻红。
    // ★ 轮数给足：无头虚拟时间跑得比真实快得多，200 轮（20s 虚拟）往往只对应真实一两秒，
    //   `/api/dashboard` 首次扫盘 + 网络还没回来就超时了（表现为偶发「应用没起来」）。
    if (d && d.querySelector && d.querySelector('#runlog') && d.querySelector('#dash-stats')
        && d.querySelectorAll('#stats-body .stat-row').length >= 5) return d;
    await sleep(100);
  }
  return null;
}

async function run() {
  const f = document.getElementById('f');
  const d = await ready(f);
  if (!d) {   // 失败也要写 #out（否则它停在 "running…"，看不出是超时还是脚本没跑）
    R.push('FAIL 应用没起来（等待超时：先确认服务在跑、且内存里有任务）');
    document.getElementById('out').textContent = R.join('\n');
    document.title = 'ACCEPT FAIL 1';
    return;
  }
  const w = f.contentWindow;
  CSS_TXT = await w.fetch('/static/style.css').then(x => x.text()).catch(() => '');
  /* ★ R37：app.js 的**源码文本**也要取一份 —— 有些判据只能落在接线处
     （元素此刻不在 DOM 里，比如「日志开头块」要等真跑才有）。 */
  JS_TXT = await w.fetch('/static/app.js').then(x => x.text()).catch(() => '');
  /* ★ R38：index.html 源码文本 —— 判「底栏挂在 .sheet layer 上」这种**结构位置**，
     拿 DOM 只能知道父子关系，拿源码才知道它排在 `.sheet-body` 之后。 */
  HTML_TXT = await w.fetch('/static/index.html').then(x => x.text()).catch(() => '');
  await sleep(1500);

  if (MODE === 'dd') {
    // 截图专用：关掉入场动画。无头环境里 CSS 动画可能停在 opacity:0 的首帧，
    // 布局是对的（getBoundingClientRect 正常）但拍出来是「透明」的。
    const st = d.createElement('style');
    st.textContent = '.dd-menu.show{animation:none !important}';
    d.head.appendChild(st);
    d.querySelector('.advanced').open = true;
    await sleep(250);
    const cli = d.querySelector('#adv-grid .cfg-group');
    if (cli) cli.open = false;                      // 收起 CLI 组，目标组落到面板顶部
    const g = d.querySelector('#adv-grid .grid .dd');
    if (g && g.closest('details')) g.closest('details').open = true;
    await sleep(300);
    d.querySelector('#adv-grid .dd-btn').click();
    await sleep(300);
    // 入场动画（opacity 0→1）在无头虚拟时间下会停在首帧 → 截图里菜单是「透明」的。
    // 强制落到终态，截图才拍得到（真实浏览器 60fps 不受影响）。
    const m = d.querySelector('.dd-menu.show');
    if (m && m.getAnimations) m.getAnimations().forEach(a => { try { a.finish(); } catch (_) {} });
    await sleep(150);
    if (m) {
      const rr = m.getBoundingClientRect(), cs = f.contentWindow.getComputedStyle(m);
      EXTRA = 'menu ' + Math.round(rr.left) + ',' + Math.round(rr.top) + ' '
        + Math.round(rr.width) + 'x' + Math.round(rr.height)
        + ' parent=' + m.parentElement.tagName + ' disp=' + cs.display
        + ' op=' + cs.opacity + ' pos=' + cs.position + ' z=' + cs.zIndex
        + ' vp=' + f.contentWindow.innerWidth + 'x' + f.contentWindow.innerHeight
        + ' anim=' + m.getAnimations().length;
      // 冻结页面里的定时器（pollLanes 每 1.5s 一轮）。无头虚拟时间下它们跑得飞快，
      // 期间任何一次 resize/滚动事件都会把菜单收掉，截图就拍不到了。
      for (let i = 1; i < 5000; i++) {
        try { f.contentWindow.clearInterval(i); f.contentWindow.clearTimeout(i); } catch (_) {}
      }
      /* 截图兜底（只影响这张图，不改产品代码）：无头截图收尾时会 resize 视口，
         应用监听了 resize → closeDDs()，菜单在快门那一瞬被收掉。
         把菜单的内联显隐钉死，快门拍到的就是它展开的样子。 */
      m.style.display = 'block';
    } else { EXTRA = 'menu=null'; }
  }
  // 截图专用：切到「产物库」页；再点开第一份产物，验证详情浮层盖在最上面
  if (MODE === 'lib' || MODE === 'libopen') {
    await sleep(1300);
    d.querySelector('.nav-btn[data-sheet="view-lib"]').click();
    await sleep(700);
    d.querySelector('#sheet').getAnimations()
      .forEach(a => { try { a.finish(); } catch (_) {} });
    await sleep(150);
    if (MODE === 'libopen') {
      const it = d.querySelector('#lib-list .item');
      if (it) it.click();
      await sleep(800);
      const det = d.querySelector('#detail');
      if (det) det.getAnimations().forEach(a => { try { a.finish(); } catch (_) {} });
      await sleep(200);
    }
  }
  // 截图专用：切到「本地资料库」页（看默认展开的现成快照列表）
  if (MODE === 'local') {
    await sleep(1300);
    d.querySelector('.nav-btn[data-sheet="view-local"]').click();
    await sleep(700);
    d.querySelector('#sheet').getAnimations()
      .forEach(a => { try { a.finish(); } catch (_) {} });
    await sleep(150);
  }
  // 截图专用：切到「联网检索库」页（m=net 折叠态 / m=netopen 展开第一组）
  if (MODE === 'net' || MODE === 'netopen') {
    await sleep(1300);
    d.querySelector('.nav-btn[data-sheet="view-web"]').click();
    await sleep(700);
    d.querySelector('#sheet').getAnimations()
      .forEach(a => { try { a.finish(); } catch (_) {} });
    await sleep(150);
    if (MODE === 'netopen') {
      const h0 = d.querySelector('#web-list .wg-head');
      if (h0) h0.click();
      await sleep(400);
    }
  }
  // 截图专用：只停在「高级参数」的**分组列表**页
  if (MODE === 'advlist') {
    await sleep(1300);
    d.querySelector('.nav-btn[data-sheet="adv-panel"]').click();
    await sleep(700);
    d.querySelector('#sheet').getAnimations()
      .forEach(a => { try { a.finish(); } catch (_) {} });
    await sleep(150);
  }
  // 截图专用：高级参数 → 点第一个分组 → 该组参数铺满
  if (MODE === 'adv') {
    await sleep(1200);
    d.querySelector('.nav-btn[data-sheet="adv-panel"]').click();
    await sleep(550);
    d.querySelector('#sheet').getAnimations()
      .forEach(a => { try { a.finish(); } catch (_) {} });
    await sleep(100);
    // 选「模型与 API」那组 —— 里面有自绘下拉，能验证「点开看得见选项」
    const _b = [...d.querySelectorAll('#adv-groups [data-advgroup]')]
      .find(b => /模型|API/.test(b.textContent))
      || d.querySelector('#adv-groups [data-advgroup]');
    if (_b) _b.click();
    await sleep(650);
    d.querySelector('#sheet').getAnimations()
      .forEach(a => { try { a.finish(); } catch (_) {} });
    await sleep(150);
    // 再点开一个下拉，顺便验证「选项真的看得见」（层级问题就出在这）
    const _dd = d.querySelector('#adv-grid .dd-btn');
    if (_dd) _dd.click();
    await sleep(450);
    const _m = d.querySelector('.dd-menu.show');
    if (_m) {
      /* ★ `--screenshot` 收尾会 resize 视口 ⇒ 应用监听了 resize 就 `closeDDs()`，
         快门那一瞬菜单被收掉（截图里就「没有可选项」）。冻结页面定时器 +
         把菜单内联 display 钉死，快门拍到的才是展开态。 */
      for (let i = 1; i < 5000; i++) {
        try { f.contentWindow.clearInterval(i); f.contentWindow.clearTimeout(i); } catch (_) {}
      }
      _m.getAnimations().forEach(a => { try { a.finish(); } catch (_) {} });
      _m.style.display = 'block';
    }
    await sleep(120);
  }
  // 截图专用：打开某个全屏面板页（读数台）
  if (MODE === 'sheet') {
    await sleep(1200);
    d.querySelector('.nav-btn[data-sheet="dash-stats"]').click();
    await sleep(700);
    d.querySelector('#sheet').getAnimations()
      .forEach(a => { try { a.finish(); } catch (_) {} });
    await sleep(150);
  }
  // 截图专用：打开搜索浮层（左上角放大镜）
  if (MODE === 'search') {
    await sleep(1200);
    d.querySelector('#search-btn').click();
    await sleep(1000);
    d.querySelector('#search-input').value = '数字IC';
    d.querySelector('#search-input').dispatchEvent(new w.Event('input', { bubbles: true }));
    await sleep(1500);
  }
  // 截图专用：把左侧抽屉拉开并落到终态（无头虚拟时间不推 transition）
  if (MODE === 'web') {
    await sleep(1400);
    d.querySelector('#drawer-btn').click();
    await sleep(600);
    d.querySelector('#drawer').getAnimations()
      .forEach(a => { try { a.finish(); } catch (_) {} });
    await sleep(120);
  }
  // 截图专用：产物详情滚到中段 —— 看「头固定、正文只在本页内滚」
  if (MODE === 'detail') {
    await sleep(1300);
    d.querySelector('.nav-btn[data-sheet="view-lib"]').click();
    await sleep(700);
    d.querySelector('#sheet').getAnimations()
      .forEach(a => { try { a.finish(); } catch (_) {} });
    await sleep(150);
    const _it = d.querySelector('#lib-list .item');
    if (_it) { _it.click(); await sleep(900); }
    const _det = d.querySelector('#detail');
    if (_det) _det.getAnimations().forEach(a => { try { a.finish(); } catch (_) {} });
    await sleep(200);
    const _bd = d.querySelector('#detail-body');
    if (_bd) _bd.scrollTop = 430;
    await sleep(200);
  }
  // 截图专用：抽屉里悬停第一个按钮 —— 看描述气泡（不被抽屉体裁剪）
  // 截图专用：回到**空态首屏**（欢迎语 + 输入框，画布底色可见）
  if (MODE === 'empty') {
    await sleep(900);
    w.newChat();
    await sleep(600);
  }
  if (MODE === 'navtip') {
    await sleep(1300);
    d.querySelector('#drawer-btn').click();
    await sleep(600);
    d.querySelector('#drawer').getAnimations()
      .forEach(a => { try { a.finish(); } catch (_) {} });
    await sleep(120);
    const _nb = d.querySelector('#drawer .nav-btn');
    if (_nb) _nb.dispatchEvent(new w.Event('mouseenter'));
    await sleep(80);
    const _tp = d.querySelector('.nav-tip');
    if (_tp) {
      _tp.getAnimations().forEach(a => { try { a.finish(); } catch (_) {} });
      _tp.style.opacity = '1';   // 冻结：快门时保持可见
    }
    await sleep(150);
  }
  // 截图专用：跑到中途的运行日志（内容居中 + 发送键已变终止键）
  if (MODE === 'runlog') {
    await sleep(900);
    // ★ 直接 POST 建任务（别依赖 startRun 的异步回填），再按真实子进程进度等待
    const r0 = await w.fetch('/api/tasks', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: '日志居中与终止键', opts: { mock: true } }),
    }).then(x => x.json()).catch(() => null);
    const id = r0 && r0.id;
    for (let i = 0; i < 9000; i++) {
      const lg = id ? await w.fetch('/api/tasks/' + id + '/log?offset=0&mode=raw')
        .then(x => x.json()).catch(() => null) : null;
      if (lg && (lg.size || 0) > 700) break;
      await sleep(1);
    }
    await showTask(w, id, '日志居中与终止键');
    await sleep(250);
    // 冻住后续轮询：快门那一刻保持「运行中 + 终止键」
    w.pollLanes = () => {};
    w.pollTask = () => {};
    await sleep(150);
  }
  // 截图专用：跑完的运行日志（看正文是否**居中自适应**）
  if (MODE === 'runlogdone') {
    await sleep(900);
    const r0 = await w.fetch('/api/tasks', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: '日志内容居中', opts: { mock: true } }),
    }).then(x => x.json()).catch(() => null);
    const id = r0 && r0.id;
    for (let i = 0; i < 9000; i++) {
      const tt = id ? await w.fetch('/api/tasks/' + id)
        .then(x => x.json()).catch(() => null) : null;
      if (tt && tt.status !== 'running' && tt.status !== 'queued') break;
      await sleep(1);
    }
    await sleep(400);
    await showTask(w, id, '日志内容居中');
    await sleep(350);
  }
  // 截图专用：抽屉按钮 + **悬停气泡**（透明底白字）
  if (MODE === 'navdesc') {
    await sleep(1200);
    d.querySelector('#drawer-btn').click();
    await sleep(500);
    d.querySelector('#drawer').getAnimations()
      .forEach(a => { try { a.finish(); } catch (_) {} });
    await sleep(150);
    const _nb = d.querySelector('#drawer .nav-btn');
    if (_nb) _nb.dispatchEvent(new w.MouseEvent('mouseover', { bubbles: true }));
    await sleep(140);
    const _tp = d.querySelector('.tip');
    if (_tp) _tp.style.opacity = '1';        // 冻结：快门时保持可见
    await sleep(140);
  }
  // 截图专用：发送的星光动画（冻结在中段：负 animation-delay + 暂停）
  if (MODE === 'fx') {
    await sleep(900);
    const _q = 'AI 能否独立完成数字 IC 设计流程？';
    const r0 = await w.fetch('/api/tasks', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: _q, opts: { mock: true } }),
    }).then(x => x.json()).catch(() => null);
    const id = r0 && r0.id;
    for (let i = 0; i < 9000; i++) {
      const lg = id ? await w.fetch('/api/tasks/' + id + '/log?offset=0&mode=raw')
        .then(x => x.json()).catch(() => null) : null;
      if (lg && (lg.size || 0) > 600) break;
      await sleep(1);
    }
    d.querySelector('#question').value = _q;
    await showTask(w, id, _q);
    await sleep(250);
    w.playSendFx(_q);
    await sleep(60);
    /* ★ 无头虚拟时间**不推 CSS 动画**（暂停/负延迟都定格在首帧）⇒ 直接把每个粒子
       按路径比例**钉在固定位置**，快门拍到的就是「飞到一半」的样子。 */
    d.querySelectorAll('#fx .spark').forEach(p => {
      const num = (k) => parseFloat(p.style.getPropertyValue(k)) || 0;
      const t = 0.42;
      const sx = num('--sx'), sy = num('--sy'), tx = num('--tx'), ty = num('--ty');
      p.style.animation = 'none';
      p.style.left = (sx + (tx - sx) * t).toFixed(1) + 'px';
      p.style.top = (sy + (ty - sy) * t).toFixed(1) + 'px';
      p.style.opacity = '1';
      p.style.transform = 'translate(-50%,-50%) scale(1)';
    });
    /* ★ 粒子的移除是 `setTimeout` 安排的；无头虚拟时间会在快门**之前**把它们全部跑掉
       ⇒ 必须先把定时器清干净，否则截出来的永远是"已经收工"的空画面。 */
    for (let i = 1; i < 9999; i++) {
      try { f.contentWindow.clearTimeout(i); f.contentWindow.clearInterval(i); } catch (_) {}
    }
    /* ★ R23：残影改**逐字裂解**（`.q-char`）——定格时保留几个字看得见即可 */
    [...d.querySelectorAll('#fx .q-char')].slice(0, 6).forEach((_g, i) => {
      _g.style.animation = 'none';
      _g.style.opacity = '0.85';
      _g.style.transform = 'translate(-50%,-50%) translate(' + (i * 5 - 12) + 'px,' + (-8 - i * 3) + 'px)';
    });
    /* ★ R23：文字裂解的同时，输入框已清空并换成「引擎已启动」寄语（定格看得见） */
    d.querySelector('#question').value = '';
    d.querySelector('#question').placeholder = 'MetaDGTF 引擎已启动 · 您愿意和我一起探寻吗？';
    const _rl = d.querySelector('#runlog');
    if (_rl) {
      _rl.style.borderColor = 'rgba(130,140,255,.55)';
      _rl.style.boxShadow = '0 0 26px 2px rgba(120,130,255,.45),0 0 60px 6px rgba(120,130,255,.18)';
    }
    await sleep(160);
    w.pollLanes = () => {}; w.pollTask = () => {};
  }
  // 截图专用：参数分组页底部（只剩「保存」、居中）
  if (MODE === 'advsave') {
    await sleep(1200);
    d.querySelector('.nav-btn[data-sheet="adv-panel"]').click();
    await sleep(550);
    d.querySelector('#sheet').getAnimations()
      .forEach(a => { try { a.finish(); } catch (_) {} });
    await sleep(120);
    const _g = d.querySelector('#adv-groups [data-advgroup]');
    if (_g) _g.click();
    await sleep(650);
    d.querySelector('#sheet').getAnimations()
      .forEach(a => { try { a.finish(); } catch (_) {} });
    await sleep(150);
  }
  // 独立模式：只验证「同一会话内重新发送」——输入框不跳位 + 日志先收起、动画落点后再露。
  // （放在 m=probe 里跑会让一条流程太长；单开一个模式，前置状态自己铺。）
  if (MODE === 'resend') {
    await sleep(1000);

  /* ── ⑦ 发送键 ↔ 终止键：跑到一半手动终止，已跑到的部分要存下来并标注状态 ──

       留下 1 份「已终止 · 部分」产物 —— 验收后请手动清掉那一份。 */

    w.newChat();

    let litSeen = false;
    const _rlEl = d.querySelector('#runlog');

    const _prevNewest = w.currentTaskId();

        _sz = (lg && lg.size) || 0;

        const _lr = (startedId && i % 3 === 0)
          ? await w.fetch('/api/tasks/' + startedId + '/layers')
              .then(x => x.json()).catch(() => null)
          : null;
        const _appLt = (startedId && w.lanes && w.lanes.tid === startedId) ? (w.lanes.text || {}) : {};

          !d.querySelector('#run-btn').classList.contains('stop'),
          'cls=[' + d.querySelector('#run-btn').className + ']');

      let t = null;
      for (let i = 0; i < 40; i++) {

        const r = await w.fetch('/api/tasks').then(x => x.json()).catch(() => null);

          .then(x => x.json()).catch(() => null);

        /* ★ R20：演练/验收（mock）产物**不入产物库** —— 只有真跑的才入库。

        chk('演练/验收产物**不入产物库**（R20：只有真跑才入库）',
            !rec,

      // 星光动画是**一次性**的：过一会儿节点应被摘干净、辉光也褪掉
      await sleep(1400);
      const left = d.querySelectorAll('#fx .spark, #fx .q-char').length;

    }

      //     判据才是主证据；这条只做形态兜底。
      const _cs = w.getComputedStyle(ap);
      chk('★R47 小窗**脱离文档流**（`absolute` / `fixed` 皆可，不许是 `static`/`relative`）',
          _cs.position === 'absolute' || _cs.position === 'fixed',
          'pos=' + _cs.position);
      const _composer = d.querySelector('.composer');
      const _ccs = _composer ? w.getComputedStyle(_composer) : null;
      chk('★R47 定位基准 `.composer` 是 relative（小窗才挂得住）',
          !!_ccs && _ccs.position === 'relative', 'composer pos=' + (_ccs ? _ccs.position : '?'));
      // 反证：小窗**打开**时也必须**不顶动**页面 —— 拿它的**容器 `.composer`**
      // 量高度：`position:absolute` 的小窗不进文档流 ⇒ 容器高度**不该变**。
      // ★ 上一版我用 `ap.nextElementSibling` 量兄弟位置，可 `#attach-panel` 是
      //   `.composer` 的**最后一个子元素** ⇒ `nextElementSibling` 恒为 `null`，
      //   判据必然假红（`before=null after=null`）。**先量再判，别想当然。**
      const _cp = d.querySelector('.composer');
      w.toggleAttachPanel(true); await sleep(100);
      const _hOpen = _cp ? _cp.getBoundingClientRect().height : null;
      ap.classList.add('hidden'); await sleep(80);
      const _hShut = _cp ? _cp.getBoundingClientRect().height : null;
      chk('★R47 小窗开/关**不改变 `.composer` 高度**（脱离文档流 ⇒ 真·不占位）',
          _hOpen !== null && _hShut !== null && Math.abs(_hOpen - _hShut) <= 2,
          'open=' + _hOpen + ' shut=' + _hShut);
      w.toggleAttachPanel(true); await sleep(80);

      // ★ R47：点**角标 ×** 走的是删除链路（这里只验「有 handler + 丢到 items」，
      //   不打真网络请求 —— 真实删除链路另有 R45 的 removeImported 判据覆盖）。
      const _rm = ap.querySelector('.ap-tile .rm');
       chk('★R47 角标 × 带 data-apdel 且可点',
           !!_rm && _rm.getAttribute('data-apdel') === '演示A.txt' && !_rm.disabled,
           'data-apdel=' + (_rm ? _rm.getAttribute('data-apdel') : '?'));

       // ── ★★ R48-2：图标格**变小**（用户图2「文件图形可以适当小一点」）──────
       //   守的是**行为**（「比原来小」），不是某个具体像素 ⇒ 判「≤ 44×48」，
       //   原来 52×56。写死 `== 40×44` 会把以后再微调判成回归。
       (() => {
         const _t = ap.querySelector('.ap-tile');
         if (!_t) { chk('★R48-2 图标格变小了（≤44×48）', false, '没有 .ap-tile'); return; }
         const _tr = _t.getBoundingClientRect();
         chk('★R48-2 图标格**变小**了（≤ 44×48，原来 52×56）',
             _tr.width > 0 && _tr.width <= 44 && _tr.height > 0 && _tr.height <= 48,
             'tile=' + Math.round(_tr.width) + 'x' + Math.round(_tr.height));
       })();

       // ── ★★ R48-1：导入完成那行提示**不显示**（用户图1「这里不要显示」）─────
       //   `#attach-msg` 用 `:empty{display:none}` 收起 ⇒ 判「没有文案 + 不占位」。
       //   ★ 判据落在**行为**（不显示）而不是「元素不存在」—— 元素是**有意保留**的。
       (() => {
         const _am = d.querySelector('#attach-msg');
         const _cs2 = _am ? w.getComputedStyle(_am) : null;
         chk('★R48-1 那行「完成 · 成功 N 个」**不显示**（元素在但空着 ⇒ display:none）',
             !!_am && (_am.textContent || '').trim() === ''
             && !!_cs2 && _cs2.display === 'none',
             _am ? 'text=' + JSON.stringify(_am.textContent)
                   + ' display=' + (_cs2 ? _cs2.display : '?') : '#attach-msg 不存在');
       })();

      await w.eval('(() => { localItems = localItems.filter(x => x.name !== "演示A.txt"); paintAttach(); })()');
      await sleep(150);
      chk('★R45-1 删掉一行后剩 1 行',
          ap.querySelectorAll('.ap-tile').length === 1,
          'tiles=' + ap.querySelectorAll('.ap-tile').length);
      await w.eval('(() => { localItems = []; paintAttach(); })()');
      await sleep(100);
       /* ★★ R48-3：徽章没了 ⇒ 换成判**数量载体归零** + **回形针提示复位**。
          守的行为没变：清空之后**界面上不该还写着旧数量**。 */
       chk('★R45-1/R48-3 清空后**数量归零**（小窗标题 0、回形针提示回到「导入文件」）',
           (() => {
             const c = d.querySelector('#ap-count');
             const b2 = d.querySelector('#attach-btn');
             const okCnt = !!c && c.textContent.trim() === '0';
             const okTip = !!b2 && /导入文件/.test(b2.getAttribute('title') || '');
             return okCnt && okTip;
           })(),
           'ap-count=' + (d.querySelector('#ap-count')
                          ? d.querySelector('#ap-count').textContent : '?')
           + ' title=' + JSON.stringify(d.querySelector('#attach-btn')
                                        ? d.querySelector('#attach-btn').getAttribute('title') : '?'));


      // ★★ 收尾：**把用户的真实列表还原回去**（本段是用例改了用户数据的最后一处）。
      await w.eval('(() => { localItems = JSON.parse(' + JSON.stringify(_realItems)
                 + ' || "[]"); paintAttach(); })()');
      await sleep(140);
      const _backN = await w.eval('localItems.length');
      chk('★R45-1 用例结束**还原用户已导入列表**（不改用户数据）',
          _backN === JSON.parse(_realItems || '[]').length,
          'restored=' + _backN + ' expect=' + JSON.parse(_realItems || '[]').length);
    } catch (e) { chk('★R45-1 paintAttach（异常）: ' + e.message, false); }
  }

  /* ② 检索库**按任务归类**（真树结构 + 真缩进） */
  try {
    // ★ 页面 key 是 `view-web`（不是 `web-lib` —— 写错只会「静默不切页」，
    //   几何判据全变 0，看着像产品 bug）。
    if (typeof w.openSheet === 'function') w.openSheet('view-web');
    await sleep(500);
    const list = d.querySelector('#web-list');
    if (!list) {
      chk('★R45-2 `#web-list` 存在', false);
    } else {
      for (let i = 0; i < 60; i++) {
        if (list.querySelector('.web-cluster')) break;
        await sleep(120);
      }
      const clusters = list.querySelectorAll('.web-cluster');
      const kids = list.querySelectorAll('.web-cluster .wg-kids');
      const subs = list.querySelectorAll('.web-group.wg-sub');
      const allG = list.querySelectorAll('.web-group');
      const sheet = d.querySelector('#sheet');
      chk('★R45-2 检索库页**真的打开着**（否则几何判据全是 0）',
          !!sheet && !sheet.classList.contains('hidden') && list.getBoundingClientRect().width > 0,
          'sheetHidden=' + (sheet ? sheet.classList.contains('hidden') : '?')
          + ' listW=' + list.getBoundingClientRect().width);
      chk('★R45-2 渲染出任务分组 `.web-cluster`', clusters.length >= 1, 'clusters=' + clusters.length);
      chk('★R45-2 有子问题容器 `.wg-kids`', kids.length >= 1, 'kids=' + kids.length);
      chk('★R45-2 子问题行带 `.wg-sub`', subs.length >= 1, 'subs=' + subs.length);
      if (kids.length) {
        const cs = getComputedStyle(kids[0]);
        chk('★R45-2 `.wg-kids` 真有**左缩进 + 竖线**（不是空规则）',
            parseFloat(cs.marginLeft) > 0 && cs.borderLeftWidth !== '0px',
            'ml=' + cs.marginLeft + ' blw=' + cs.borderLeftWidth);
      }
      if (kids.length && subs.length) {
        // ★ 几何判据必须在**页面还开着**时测（closeSheet 后 rect 全 0）；
        //   阈值要**实质**（只写 `>` 0 时 M10 仍 PASS，差 1px）⇒ 要求 ≥ 8px。
        const kr = kids[0].getBoundingClientRect();
        const sr = subs[0].getBoundingClientRect();
        const dlt = sr.left - kr.left;
        chk('★R45-2 子问题几何上确实缩进在根问题右侧（≥8px 实质间距）',
            dlt >= 8 && sr.width > 0,
            'Δleft=' + dlt + ' sub=' + sr.left + ' kids=' + kr.left);
      }
      chk('★R45-2 两向对账：根 + 子 == 全部组数（不丢不重）',
          clusters.length + subs.length === allG.length,
          'root ' + clusters.length + ' + sub ' + subs.length + ' vs all ' + allG.length);
      if (clusters.length) {
        chk('★R45-2 子问题**嵌在**根节点容器内（不是平铺的两个兄弟）',
            clusters[0].querySelectorAll('.web-group').length >= 1,
            'inCluster0 groups=' + clusters[0].querySelectorAll('.web-group').length);
      }
    }
    if (typeof w.closeSheet === 'function') w.closeSheet();
    await sleep(200);
  } catch (e) { chk('★R45-2 归类（异常）: ' + e.message, false); }

  /* ③ 首屏**不许**看见滚动点（R44 第 4 条的彻底修法） */
  try {
    if (typeof w.newChat === 'function') w.newChat();
    await sleep(500);
    const bar = d.querySelector('#rl-bar');
    chk('★R45-3 首屏存在 `#rl-bar`（它还在，只是看不见）', !!bar);
    if (bar) {
      chk('★R45-3 首屏正常态下 `#rl-bar` **没有** `.on`', !bar.classList.contains('on'),
          'cls=' + bar.className);
      // 人为点亮：模拟「上一次留在 .on 没灭」—— 这正是用户看到的现象
      bar.classList.add('on');
      await sleep(60);
      const cs = getComputedStyle(bar);
      // ★★ 真因（本轮 CDP 诊断锁定）：`#rl-bar` 带 `transition:opacity .15s`，而
      //    **无头虚拟时间不推进 CSS transition** ⇒ `classList.add('on')` 后立刻量，
      //    `opacity` 停在**起始帧**（1），尽管兜底规则 `opacity:0 !important` 已命中
      //    （诊断输出里 `hit=…body.stage-empty #rl-bar=0!`，`pointer-events` 也是 none，
      //     证明规则确实生效 —— 只有 opacity 卡在过渡中间）。
      //    ⇒ 量之前**先 finish 动画/过渡**（技能里「坑 2」的正解），否则读数不可信。
      bar.getAnimations?.().forEach(a => { try { a.finish(); } catch (e) {} });
      await sleep(30);
      const cs2 = getComputedStyle(bar);
      chk('★R45-3 首屏（stage-empty）里**即使** `.on` 在，计算出的 opacity 也是 0',
          parseFloat(cs2.opacity) === 0,
          'stage=' + d.body.className + ' opacity=' + cs2.opacity
          + ' matches=' + bar.matches('body.stage-empty #rl-bar')
          + ' pe=' + cs.pointerEvents);
      chk('★R45-3 首屏里那个点**点不到**（pointer-events:none）',
          cs.pointerEvents === 'none', 'pe=' + cs.pointerEvents);

      /* ★ 双层防御要**分别**证明（M15 教训）：
         CSS 兜底与 JS 判据各自独立。只测「结果 opacity=0」时，JS 那层坏了 CSS 还挡着
         ⇒ 判据不会红。而 updateRlBar 里**有好几条早退**（日志区 hidden / 滚距 ≤8 / 高度 <60），
         它们也会摘掉 `.on` —— 所以「随便点一下 .on 再调 updateRlBar」测的是**共性**。
         要隔离 stage-empty：把其它早退条件**都摆成不成立**（日志区可见、有高度、**确实可滚**），
         唯一能救的就是 stage-empty 那一条。 */
      const _box = d.querySelector('#runlog');
      const _bd = d.querySelector('#runlog-body');
      const _sv = {
        boxCls: _box.className, bodyCls: d.body.className,
        boxStyle: _box.getAttribute('style'), bdStyle: _bd ? _bd.getAttribute('style') : null,
        bdHtml: _bd ? _bd.innerHTML : null,
      };
      _box.classList.remove('hidden');
      _box.style.display = 'block'; _box.style.height = '300px';
      if (_bd) {
        _bd.style.display = 'block'; _bd.style.height = '120px';
        _bd.style.minHeight = '120px'; _bd.style.overflow = 'auto';
        _bd.innerHTML = new Array(120).fill('<div class="lg-line">x</div>').join('');
      }
      d.body.classList.remove('stage-run', 'panel-open');
      d.body.classList.add('stage-empty');
      bar.classList.add('on');
      await sleep(60);
      const _okBox = !_box.classList.contains('hidden');
      const _bdH = _bd ? _bd.clientHeight : -1;
      const _over = _bd ? (_bd.scrollHeight - _bd.clientHeight) : -1;
      if (typeof w.updateRlBar === 'function' && _okBox && _bdH >= 60 && _over > 8) {
        w.updateRlBar();
        await sleep(80);
        chk('★R45-3 JS 层判据：**隔离** stage-empty（日志区可见有高度**且确实可滚**）后，'
            + 'updateRlBar() 仍主动摘掉 `.on`（不靠 CSS 遮）',
            !bar.classList.contains('on'),
            'stage=' + d.body.className + ' bdH=' + _bdH + ' over=' + _over + ' cls=' + bar.className);
      } else {
        chk('★R45-3 JS 层判据：隔离失败（前置条件没摆好 ⇒ 判据无效）', false,
            'boxVis=' + _okBox + ' bdH=' + _bdH + ' over=' + _over);
      }
      // 复原
      _box.className = _sv.boxCls;
      if (_sv.boxStyle === null) _box.removeAttribute('style'); else _box.setAttribute('style', _sv.boxStyle);
      if (_bd) {
        if (_sv.bdStyle === null) _bd.removeAttribute('style'); else _bd.setAttribute('style', _sv.bdStyle);
        if (_sv.bdHtml !== null) _bd.innerHTML = _sv.bdHtml;
      }
      d.body.className = _sv.bodyCls;
      await sleep(60);

      // 负对照：摘掉 stage-empty ⇒ 兜底不该把点永久压死
      bar.classList.add('on');
      await sleep(60);
      const _had = d.body.classList.contains('stage-empty');
      d.body.classList.remove('stage-empty');
      await sleep(80);
      const pe2 = getComputedStyle(bar).pointerEvents;
      if (_had) d.body.classList.add('stage-empty');
      chk('★R45-3 负对照：**不是**首屏/面板态时兜底不生效（点恢复可交互）',
          pe2 !== 'none', 'pe(非空态)=' + pe2);
      bar.classList.remove('on');
    }
  } catch (e) { chk('★R45-3 首屏点（异常）: ' + e.message, false); }

  /* ── ⑥ 开启新对话：清掉当前显示、回到首屏 ──────────────────────
     ★ 放在**最后**测：它会把运行日志清掉，前面那些依赖日志的断言不能再受影响。 */
  d.querySelector('#newchat-btn').click();
  await sleep(450);
  chk('点「开启新对话」：回到首屏（stage-empty + 日志收起 + 输入框清空 + 浮层关闭）',
      d.body.className.indexOf('stage-empty') >= 0
      && d.querySelector('#runlog').classList.contains('hidden')
      && d.querySelector('#question').value === ''
      && d.querySelector('#search-overlay').classList.contains('hidden')
      && d.querySelectorAll('#runlog-body').length === 1,
      'stage=' + d.body.className
      + ' logHidden=' + d.querySelector('#runlog').classList.contains('hidden')
      + ' q=[' + d.querySelector('#question').value + ']');
}

/* ★ 诊断：把已完成的判据**边跑边写**进 `#out` —— 无头下若某一步卡住，
   dump 出来就能直接看到「最后跑到哪一条」，不用靠猜。 */
setInterval(() => {
  const el = document.getElementById('out');
  if (el && el.textContent.indexOf('ACCEPT 结果') < 0) {
    el.textContent = R.join('\n') + '\n…（进行中）';
  }
}, 300);

(async () => {
  try { await run(); }
  catch (err) { R.push('FAIL 探针异常  | ' + (err && err.message)); }
  finally {
    const pass = R.filter(x => x.startsWith('PASS')).length;
    const fail = R.filter(x => x.startsWith('FAIL')).length;
    document.getElementById('out').textContent =
      R.join('\n') + '\n\nACCEPT 结果：PASS ' + pass + ' / FAIL ' + fail;
    document.title = 'ACCEPT PASS ' + pass + ' FAIL ' + fail + (EXTRA ? ' | ' + EXTRA : '');
  }
})();
</script>
</body></html>
