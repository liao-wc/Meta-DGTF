auto:
  enabled: true
  allow_route_trim: true
  history_limit: 200
  history_md: true
  history_batch: true
  history_halflife_days: 14
runtime:
  web: auto
  thinking: auto
  effort: auto
api:
  key: ''
  base_url: https://api.deepseek.com/v1
  default_model: deepseek-chat
  reasoner_model: deepseek-flash
  thinking:
    default: disabled
    reasoner: enabled
    effort: high
    stages:
      auto_plan: enabled
      plan_orientation: enabled
      plan_resources: enabled
      adjudicate_sub_tristate: enabled
      dual_judge: enabled
      assess_decidability: enabled
      assess_decidability_from_pool_view: enabled
      re_evaluate_pool: enabled
      decide_parallel_mode: disabled
      check_input_sanity: disabled
      check_structure_saturation: disabled
      re_anchor: disabled
      ask_missing_polarity: disabled
      decompose_normal: disabled
      decompose_hybrid: disabled
      decompose_koan: disabled
      decompose_from_pool: disabled
      probe_research: disabled
      probe_duel: disabled
      probe_meta: disabled
      phase_probe: disabled
      self_check: disabled
      settle_research: disabled
      adjudicate_sub_tristate_multi: disabled
      anchor_crosscheck: disabled
  timeout: 240
  max_retries: 3
  retry_backoff: 1.8
output:
  save_dir: outputs
  verbose: true
  dump_rounds: false
  show_dual_judge: true
  show_ing: false
  show_manifest: false
  self_check: true
  show_probe_diag: true
actions:
  input_sanity: true
  assess_decidability: true
  decompose_question: true
  decidability_source: pool
  decompose_source: pool
  tri_multi_vote: true
  tri_vote_retry_empty: 1
  parallel_mode: auto
  parallel_expand: true
  parallel_warmup_rounds: 3
  pipeline_gate_timeout: 900
  re_anchor: true
  expand_yin: true
  expand_yang: true
  dual_judge: true
  ing: true
  he: true
  phase_probe: true
  manifest: true
  landing_decision: true
  self_check: true
  re_evaluate_pool: true
  settle_research: true
probe:
  min_gain: 0.5
  select_n: 5
memory:
  channels: content,context,self
  self_layers: 4
  self_layers_per_entry: 2
  shape_items: 10
  shape_chars: 1200
  carry_feedback: true
external_anchor:
  enabled: true
  path: ''
  max_items: 12
  retriever: snapshot
  api_key_env: TAVILY_API_KEY
  cache_ttl_hours: 24
  per_round: 2
  tier_floor: 2
  crosscheck: true
  answers_min_len: 6
  answers_max_n: 5
  as_evidence: 'off'
  triage: false
web_search:
  enabled: true
  backend: tavily
  api_key_env: TAVILY_API_KEY
  timeout_seconds: 30
  max_retries: 2
  backoff_seconds: 1.8
  cache_ttl_hours: 24
  quota:
    per_stage_round: 2
    per_stage_total: 8
    per_run_total: 30
  stages:
    practice_term_calibration: false
    research_decompose: true
    research_evidence: true
    research_precedent: true
    duel_arbitration: true
    meta_clean_check: true
    stop_criteria: false
  as_evidence: crosscheck
  tier_floor: 3
  auto_disable_after_failures: 3
  tier_confirmed: {}
  tier_proposal: false
  domain_tier_rules: .gov.cn,1,.gov,1,.edu,2,iso.org,1,standard,1,wikipedia.org,3,blog,4,forum,4
spiral:
  soft_max: 2
  hard_max: 12
  all_extra_rounds: 2
  stop_similarity: 0.7
  stable_need: 3
  stable_layers: 2
  batch_similarity: 0.7
  meta_cover_similarity: 0.7
  idle_limit: 2
  round_idle_limit: 2
  new_item_similarity: 0.7
  new_item_overlap: 0.7
  thread_new_similarity: 0.7
  thread_new_overlap: 0.7
  structure_saturation_enabled: true
  structure_saturation_every_n: 2
  round_stall_limit: 2
  escalate_starve_rounds: 3
  no_push_when_idle: 2
  budget_per_round_floor: 10
  budget_per_round_cap: 12
  rehash_similarity: 0.7
  stall_streak_limit: 2
  min_distance_improvement: 0.03
  convergence_window: 2
  unsaid_escape_limit: 2
  both_tighten_ratio: 0.5
  both_quota:
    enabled: true
    max_ratio: 0.7
    min_items: 2
  alignment_similarity: 0.7
  alignment_containment: 0.7
  dedup_candidate_overlap: 0.7
  dedup_candidate_similarity: 0.7
  dedup_amp_overlap: 0.7
  dedup_amp_similarity: 0.7
  qc_rephrase_ratio: 0.7
  qc_both_ratio: 0.7
  all_drift_threshold: 0.7
  all_selfref_threshold: 0.7
  re_eval_every_n: 1
  re_eval_recent_k: 10
  min_rounds:
    '0': 0
    '1': 0
    both: 0
    all: 0
