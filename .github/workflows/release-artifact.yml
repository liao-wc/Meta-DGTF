name: release-artifact
on:
  push:
    tags: ['app-v*', 'engine-v*']
permissions:
  contents: write
  id-token: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Package source without local model binaries
        run: |
          zip -r "meta-dgtf-${GITHUB_REF_NAME}.zip" . \
            -x 'local_model/models/*' 'local_model/envs/*' 'outputs/*' 'dgtf_memory/*' 'archive/*' '*.log'
          sha256sum "meta-dgtf-${GITHUB_REF_NAME}.zip" > SHA256SUMS
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: meta-dgtf-${{ github.ref_name }}.spdx.json
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign checksums (keyless)
        run: |
          cosign sign-blob --yes \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem \
            SHA256SUMS
      - uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: |
            meta-dgtf-${{ github.ref_name }}.zip
            SHA256SUMS
            SHA256SUMS.sig
            SHA256SUMS.pem
            meta-dgtf-${{ github.ref_name }}.spdx.json
