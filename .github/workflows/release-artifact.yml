name: release-artifact
on:
  push:
    tags: ['app-V*', 'engine-V*']
permissions:
  contents: write
  id-token: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Package source without local model binaries
        run: |
          zip -r "meta-dgtf-${GITHUB_REF_NAME}.zip" . \
            -x 'local_model/models/*' 'local_model/envs/*' 'outputs/*' 'dgtf_memory/*' 'archive/*' '*.log'
          sha256sum "meta-dgtf-${GITHUB_REF_NAME}.zip" > SHA256SUMS
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
      - name: Download SBOM artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: meta-dgtf-package.spdx.json
          path: sbom
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign checksums (keyless bundle)
        run: |
          cosign sign-blob --yes \
            --bundle SHA256SUMS.bundle \
            SHA256SUMS
      - uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: |
            meta-dgtf-${{ github.ref_name }}.zip
            SHA256SUMS
            SHA256SUMS.bundle
            sbom/meta-dgtf-package.spdx.json
