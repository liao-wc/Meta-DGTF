name: repo-classification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Classify tracked files
        run: python scripts/dsh_repo_classify.py classify
      - name: Guard categories
        run: python scripts/dsh_repo_classify.py check
      - name: Publish summary
        run: cat reports/repo_classification.md >> "$GITHUB_STEP_SUMMARY"
