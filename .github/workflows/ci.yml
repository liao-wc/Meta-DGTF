name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.13' }
      - run: python -m py_compile dgtf_app/server.py dgtf_app/rag_embed_service.py
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.13' }
      - run: python -m py_compile dgtf_engine/dgtf_v2/engine/Meta-DGTF-道生三阶模型-V2.0.0.py
      - run: PYTHONPATH="$PWD/dgtf_engine" python -c "import dgtf_v2.tests_evidence as t; raise SystemExit(t.main())"
  local-model:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: test -f local_model/README.md && test -f .github/repo_manifest.json
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.13' }
      - run: python scripts/dsh_repo_classify.py classify
      - run: cat reports/repo_classification.md >> "$GITHUB_STEP_SUMMARY"
