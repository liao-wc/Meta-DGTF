name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.13' }
      - run: python -m py_compile dgtf_app/server.py dgtf_app/rag_embed_service.py
      - run: python scripts/app_version_check.py
      - run: python scripts/file_integrity_check.py
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.13' }
      - run: python -m pip install -r requirements.txt
      # 不写死引擎版本：取 engine/ 下最高版本再编译（版本升级后 CI 仍生效）
      - run: python -c "import pathlib,re,py_compile;d=pathlib.Path('dgtf_engine/dgtf_v2/engine');c=list(d.glob('Meta-DGTF*-V*.py'))+list(d.glob('元DGTF-V*.py'));c.sort(key=lambda p:tuple(int(x) for x in re.search(r'V(\d+)\.(\d+)\.(\d+)',p.name).groups()));assert c,'no engine found';py_compile.compile(str(c[-1]),doraise=True);print('compiled',c[-1])"
      # 全量 V2 测试（35 个文件）：统一运行器逐文件独立进程跑；
      # 干净 checkout 无 outputs/ 回放数据时，3 个真实 packed 回放检查显式 SKIP。
      - run: python scripts/run_v2_tests.py
  local-model:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: test -f local_model/README.md && test -f .github/repo_manifest.json
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.13' }
      - run: python scripts/dsh_repo_classify.py classify
      - run: cat reports/repo_classification.md >> "$GITHUB_STEP_SUMMARY"
