name: Feature request
description: 新功能或改进
labels: [enhancement]
body:
  - type: dropdown
    id: area
    attributes:
      label: 分类
      options: [App, Engine, Local Model, Docs, Ops, Deploy]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 方案
