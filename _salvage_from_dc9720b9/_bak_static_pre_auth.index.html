<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>元DGTF 工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="glyph" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    元DGTF <span class="sub">工作台</span>
  </div>
  <nav class="tabs">
    <button class="tab active" data-view="run">运行台</button>
    <button class="tab" data-view="lib">产物库</button>
    <button class="tab" data-view="local">本地资料库</button>
    <button class="tab" data-view="web">联网检索库</button>
  </nav>
  <div class="env" id="env-info"></div>
</header>

<main>
  <!-- 运行台：任务卡在上，输入框在下 -->
  <section id="view-run" class="view active">
    <div id="tasks" class="tasks"></div>
    <div id="tasks-empty" class="muted empty">还没有任务。在下面填一个问题、点「开始深究」。</div>

    <div class="composer">
      <textarea id="question" rows="2" spellcheck="false"
        placeholder="输入要深究的问题，例如：AI 能否独立完成数字 IC 设计流程？"></textarea>
      <div class="composer-actions">
        <label class="mock-toggle">
          <input type="checkbox" id="mock">
          <span class="sw" aria-hidden="true"></span>
          演练模式（mock：不花钱、几秒出结果，仅验证链路）
        </label>
        <button id="run-btn" class="primary">开始深究 <kbd>&#8984;/Ctrl+&#9166;</kbd></button>
      </div>
      <details class="advanced">
        <summary>高级参数（留空 = 交给引擎 auto 自决）</summary>
        <div class="grid" id="adv-grid"></div>
      </details>
      <div class="warn" id="cost-warn"></div>
    </div>
  </section>

  <!-- 产物库 -->
  <section id="view-lib" class="view">
    <div class="searchbar">
      <div class="search-wrap">
        <input id="lib-q" placeholder="搜索标题 / 元数据 / 正文…">
        <kbd>/</kbd>
      </div>
      <label class="chk"><input type="checkbox" id="lib-body"> 搜正文</label>
      <select id="lib-decid"><option value="">可判定性：全部</option></select>
      <select id="lib-orient"><option value="">取向：全部</option></select>
      <select id="lib-days">
        <option value="">时间：全部</option>
        <option value="7">最近 7 天</option>
        <option value="30">最近 30 天</option>
        <option value="90">最近 90 天</option>
      </select>
      <button id="lib-search">搜索</button>
    </div>
    <div id="lib-count" class="muted"></div>
    <div id="lib-list" class="lib-list"></div>
  </section>

  <!-- 本地资料库：导入本地文件 → 外部证据锚点 -->
  <section id="view-local" class="view">
    <div class="hint">
      导入本地文件作为<strong>外部证据锚点</strong>：文件存进
      <code>dgtf_app/anchors/</code>，并自动重建一份合并快照
      <code>anchors/external_anchor.json</code> —— 把
      <code>dgtf_config.yaml</code> 的 <code>external_anchor.path</code>
      指到它即可当锚点用。
    </div>
    <div class="import-bar">
      <label class="chk"><input type="file" id="anchor-file" multiple> 选择文件导入…</label>
      <span class="muted" id="import-msg"></span>
    </div>
    <div id="local-count" class="muted"></div>
    <div id="local-list" class="lib-list"></div>
    <div class="hint" id="local-cand-hint" style="margin-top:18px"></div>
    <div id="local-cand" class="lib-list"></div>
  </section>

  <!-- 联网检索库：历次跑圈的联网命中 -->
  <section id="view-web" class="view">
    <div class="hint">
      从历次产物头部的「外部锚点 · 联网」读数汇总（收了多少条 / 几个环节 / tier）。
    </div>
    <div id="web-count" class="muted"></div>
    <div id="web-list" class="lib-list"></div>
  </section>
</main>

<div id="detail" class="detail hidden">
  <div class="detail-inner">
    <div class="detail-head">
      <div id="detail-title"></div>
      <button id="detail-close" class="ghost">关闭 <kbd>Esc</kbd></button>
    </div>
    <div id="detail-body" class="md"></div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
