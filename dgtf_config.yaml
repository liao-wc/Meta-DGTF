# ============================================================
# Meta-DGTF-道生三阶模型 · V2.2.103 配置文件
# ============================================================
#
#
# ★★ 【本机最优配置】v1.23.65 起不再依赖 all_on：
#     下列能力已**逐项显式**写在文件里（生效值即所见）：
#       playbook.mode=on / stop.anytime_alpha=0.05 / web_search.enabled=true /
#       external_anchor.as_evidence=gate / api.thinking.default=enabled,
#       effort=low / actions.merge_expand=true / spiral.shape_limit=8 /
#       max_tokens=2000000 / 三个实测无收益的思考环节关闭。
#     all_on=false：避免运行时覆盖单项，便于做对照实验；要一键全开可改 true。
#     ★ 引擎侧 `DEFAULT_CONFIG["all_on"]` 仍是 false（保守默认）：
#       判据/冒烟走引擎默认 ⇒ 基线不受影响。
all_on: false

# 【用途】总 token 软预算（0 = 不设限）。到点走层/圈边界优雅停，可 resume_ckpt 续跑。
# 【建议】2000000（≈ 本仓库 129 calls / 1.16M 覆盖 100% 的 1.7 倍；挡住 2.94M 级跑次）。
max_tokens: 2000000

# 【V2 影子调度】只观察、不改执行：记录 V2 在起点/终点会怎么选，
#   并把同预算的 mock 参考轨迹写进产物。默认 false（零行为差），
#   本机开 true 收集 Phase 1 数据；失败只留痕，不阻断 V1。
scheduler:
  v2:
    enabled: true
    shadow: true
    # V2 默认 joint：V1/V2 统一仲裁，不再分两套执行
    mode: joint
    eml_path: dgtf_memory/v2_events.jsonl
    contract_gate: warn
    allow_anon: false
    # Phase 4：true 才接管「串行初始排程」；层内算法仍是 V1。
    takeover: true
    # [v1.24.0] 四层核心职责审计门禁（core_duty 读数）：
    #   warn（默认）= 只告警 + packed.quality.flags 加 "core_audit_gaps"，不阻断运行；
    #   off = 完全不出读数（不写 packed.core_ok、不加旗标）。
    core_gate: warn

# ============================================================
# 统一自适应调度器（v1.23.13）—— 十二项逐项可单独接管
#   优先级：命令行显式 ＞ 本配置（**改过**才认）＞ auto ＞ 出厂默认
# ------------------------------------------------------------------
# enabled：总开关。true（出厂）= auto 按题型/成本/历史接管十二项；
#   false ⇒ 全项退回「配置 / 默认」，行为回到 v1.23.12（**可回退**）。
# allow_route_trim：false ⇒ auto 永不砍层（层集合恒为 0,1,both,all）。
# history_limit：调度器扫多少份 `outputs/*.packed.json` 做历史读数
#   （成本中位 / 被截断率 / 各层实际停圈 / 联网命中与失败 / 取向错配）。
# ★ 想固定某一项：命令行显式传（`--route/--parallel/--rounds/
#   --orientation/--landing/--decidability/--web/--thinking/--effort`），
#   或改这里对应的键（如 `spiral.round_stall_limit` / `web_search.quota`）。
#   产物头部「自动调度」表会逐项写出**取值 / 来源 / 理由**。
# ============================================================
auto:
  enabled: true
  allow_route_trim: false
  # 事实短题只砍圈：四层仍全跑，每层最多 2 圈。
  fact_flow:
    rounds_max: 2
  # 语料实测：outputs/ 里有 368 份产物 md + 16 条跑批记录；默认只扫 20 份
  # 等于把历史样本丢了 95%。200 够覆盖现有语料（实测扫描耗时 ~0.16s）。
  history_limit: 200
  # 历史取样源开关：
  #   history_md    —— 扫产物 md 的头部行（只读前 8KB，覆盖最广）
  #   history_batch —— 扫仓库根的 *_runs.json 跑批记录（富字段、样本少）
  # 关掉任一项都会显著减少样本（判据里有负对照守着这一点）。
  history_md: true
  history_batch: true
  # 历史读数的**时间衰减半衰期**（天）。0 = 不衰减（等权）。
  # 语料跨十几天，旧样本是旧配置下的读数；不加权会把新读数拉向旧行为。
  history_halflife_days: 14
  # 【v1.23.33】预算 bandit（默认 false = 关 ⇒ 零行为差）。
  #   true 时用 UCB1-with-cost 在每层圈数上限三档（3/4/6）间选择；
  #   奖励 = 职责度中位 − cost_w ×（tokens/1000）。探索会故意选较差档。
  bandit:
    enabled: false
    cost_w: 0.3
    c: 1.0

# 【v1.23.62 → v1.23.63】非结构化输出要留痕 + `max_retries=0` 脚枪
#   ① 问题（故障注入，打底层 `client.chat.completions.create`）：
#      抛异常 / 空内容 ⇒ 重试→抛→调用点记 errors（**留痕**）；
#      但 **非 JSON 文本 / "null"** ⇒ 内容非空、解析失败 ⇒ 当空处理、**零留痕**。
#      「答了但答不成结构」这一类静默丢失：产物看起来只是"内容少"，
#      读的人分不清"模型不配合"与"题本身没什么可写" ⇒ 违反红线「失败留痕」。
#   ② 修法：`LLM` 增 `bad_json` 计数；`call()` 在 `json_mode=True` 且解析不出时
#      +1 并 warning（带片段）；产物顶层增 `llm_bad_json`；md 在 >0 时加一行提示。
#      **不改控制流**：解析失败仍走原兜底，只是这件事现在有记录。
#   ③ 顺带脚枪：重试循环是 `range(1, max_retries+1)` ⇒ `max_retries=0` 是**空循环**
#      ⇒ 所有调用必失败且报错 `last_err=None`（看不出根因）。改成至少尝试 1 次；
#      默认 3 次**行为完全不变**。
#   ★ 无新配置键。

# 【v1.23.61 → v1.23.62】把 `contra`（反向证据）**接活**
#   ① 问题（死代码审计）：`contra` 唯一的写入点是 `eml_note_contra()`，而它
#      **全项目没人调用**（AST 审计：名字全文只出现 1 次）⇒ `contra` 恒 0
#      ⇒ `eml_promote` 里「反向证据够了不许升级」那条**永远不触发**。
#      判据在、输入没人产出 —— 与"读数无出口"是同一类死法。
#   ② 修法：`_eml_note_use()` 的**负面分支**（用了但本跑读数不达标）除了降
#      weight，再记一次 contra。这样 `contra` 才有来源，晋升闸才是活的。
#   ★ 行为变化：`playbook.mode` 默认 shadow/off ⇒ 默认路径零影响；打开 EML 时，
#     被反复证明"用了没用"的条目会在 3 次负面后不再被升级（正是文档写的语义）。
#   ★ 无新配置键。

# 【v1.23.60 → v1.23.61】`run()` 的空题守卫（拒绝运行，不凭空产出、不花钱）
#   ① 问题（健壮性探针）：退化输入 9 例没一个打挂引擎，但 **`run("")` 照样跑了、
#      产出 2 个候选** —— 空题没有可研究的东西，跑下去只会产出**凭空编造的候选**
#      （违背「没读数就不假装 / 未对齐如实说」），而且白花一次调用。
#      app 那边有挡（`server.py` 返回 400），但**引擎是库**，任何脚本都能直接传空串。
#   ② 修法：`run()` 在**任何 LLM 调用之前**检查 `str(question).strip()`；为空 ⇒
#      立刻返回结构化拒绝 `refused={reason:"empty_question", why:…}` +
#      `views={}` + `llm_calls=0`，并 `vp` 一行说明。
#      ★ 不抛异常（会打断调用方）；也不用 `paused`（那是"没跑完"，这是"不该跑"）。
#   ★ 无新配置键；题面非空 ⇒ 行为逐字不变。

# 【v1.23.59 → v1.23.60】快照记**层内进度**（只记录，不改续跑行为）
#   ① 问题：检查点原来只在**层完成**时才有该层状态 ⇒ 一层跑到第 5 圈被杀，
#      快照里只知道"这层没完成"，**不知道死在第几圈**；估预算也只能按层不按圈
#      （实测一层 4~7 圈，时长差 2 倍）。
#   ② 修法：`_layer_goal_now`（三个执行器每圈都走到这一处）顺手记
#      `_layer_progress[entry]` = rounds_done / candidates / amps / threads / 本圈读数；
#      `_ckpt_snapshot` 把它与 `goal_hist` 一起写进快照。
#   ③ **不做圈内恢复**：`seeds`/`carry` 由上一圈 View 派生、**不是纯函数** ⇒
#      中途恢复会得到"另一条轨迹"却挂着同一 run_id —— 比整层重跑更危险。
#      详见 `docs/圈内检查点-设计.md` §三。续跑侧**一个字没改**。
#   ★ 无新配置键。

# 【v1.23.58 → v1.23.59】修行层增益**换信号**：Heaps 边际 → 相对新增率
#   ① 问题：`stop.gain_floor` 的输入是 `refinement_gain`，修行层取 `excavate`
#      （Heaps 边际 ΔV/Δn）。那个读数要 `len(hist)>=3` 才开算，退化增长还返回 None
#      ⇒ 实测 4 圈里 3 圈 None ⇒ 增益恒 None ⇒ **早停判据永远不触发**（信号稀疏）。
#   ② 换法：修行层增益改取**相对新增率** = max(0, Δn_aspects) / 上圈 n_aspects。
#      只要有两圈、上圈 n>0 就有值；语义仍是「新增趋零」；0..1 有界，与 α 同量纲。
#   ③ 保留：`excavate` 读数本身不动（四层目标的公开读数，目标定义是红线）；
#      其余三层方向不动（settle/fuse/crystallize 仍是「本圈 − 上圈」）；
#      **老产物没有 `n_aspects` ⇒ 退回 Heaps 算路**（逐字不变）。
#   ★ 无新配置键；`gain_floor` 默认 0 ⇒ 判据直接返回 ⇒ 出厂零行为差。

# 【v1.23.57 → v1.23.58】晋升门槛 `_eff_n` 与 shadow 拦截原因**进产物**
#   ① 问题：`eml_promote` 里自适应后的实际门槛 `_eff_n` 只活在函数内部，产物里查不到
#      ⇒「库 11 < 冷启 20 ⇒ 门槛降到 1，但被质量闸挡下」只能**推断**。
#      「我推断它降到了 1」与「产物里写着 1」是两件事。
#   ② 修法：`eml_promote(..., trace=None)` 多收一个 dict，填 `eff_n` / `promote_n` /
#      `adaptive` / `n_lib` / `cold_lib` / `shadow`（逐条 verdict）/ `shadow_verdicts`；
#      调用方挂成 `_blk["promote_trace"]`，产物 md 正文加一行「晋升门槛 ≥N（自适应…）
#      ｜shadow 拦截：n_short×2、quality_down×1…」。
#   ③ 五类 verdict：`n_short` / `contra` / `quality_down` / `cost_only` / `promoted`
#      —— 否则「0 升级」分不清是"没东西可升"还是"有但被挡住"。
#   ★ 无新配置键；不传 `trace` ⇒ 行为**逐字不变**（默认 None）。

# 【v1.23.56 → v1.23.57】把 `goal_trace` **跨圈接上**（`stop.gain_floor` 才走得到）
#   ① 缺陷：引擎**每圈新建 view**（`view = dg.run(inp)`），而目标读数只 append 到
#      **当圈那个 view** ⇒ 下一圈换对象就丢。产物实测：跑 4~7 圈，`goal_trace`
#      每层只有 **1** 条。
#   ② 后果：`layer_gain_stop_signal` 第一道门是 `len(prev) >= _LG_STOP_FLAT_N+1`（=3），
#      而它拿到的 `prev` 恒 1 条 ⇒ 门恒关 ⇒ **`stop.gain_floor` 在任何取值下都不触发**。
#      ——这是「结构性不可达」，不是阈值太严（扫 6/8/12 只会得到三个"零触发"）。
#   ③ 修法：历史挂在**引擎**上（`self._goal_hist[entry]`），每圈把完整历史挂回当前
#      view；`run()` 起跑清空（同一实例可能被复用）。
#   ★ 只搬数据、不动判据；`gain_floor` 默认 0（关）⇒ 出厂行为**逐字不变**。

# 【v1.23.55 → v1.23.56】快照记账改成**跨窗口累计**
#   ① 问题：快照里的 `llm_calls` / `llm_tokens` 取自 `self.llm.total_calls`，那是
#      **按实例**的计数器。续跑新建实例就归零 ⇒ 第二个窗口的快照只记本窗口。
#      实测（A/B 真跑）：这条 run_id 实际花了 230 calls，快照里写的 **97**。
#      按这个数结算成本，前面那个窗口的钱**查不到** —— 直接打穿 v1.23.50 立命的
#      「被杀跑次也能结算成本」。
#   ② 修法：`load_resume_snapshot` 把快照里的计数一起返回；`run()` 记进
#      `self._ck_base`；`_ckpt_snapshot` 落盘写 **累计 = 基线 + 本实例**，
#      并**另存** `window_calls` / `window_tokens` 保留本窗口读数
#      （结算看累计，分析看窗口）。
#   ★ 无新配置键；不传 `resume_ckpt` ⇒ 基线为 0 ⇒ 数值与旧版**逐字相同**。

# 【v1.23.54 → v1.23.55】`paused` 时的缺层从「❌ 缺陷」改成「⏸ 待续」
#   ① 问题：A/B 真跑暂停时产物打了「❌ 缺层：请求了但这些层没有产出 —— 这份产物
#      是不完整的 / · 元：未记录原因（这是缺陷）」。可暂停时缺层是**设计**
#      （续跑会接着跑）——这条提示会让人去查一个不存在的 bug；更糟的是它把
#      `layer_gap` 写进产物，下游任何「缺层=缺陷」的判据都跟着误判。
#   ② 修法：`_layer_guard` 把缺层拆两拨 —— 在 `pending_layers` 里且 `paused`
#      ⇒ 记 `paused_gap` 并说"待续"；其余 ⇒ 仍是真缺陷，照样大声报红。
#   ★ 真缺陷**不许**被暂停豁免：暂停时某层既没产出也不在 pending 里，照样报。
#   ★ 无新配置键；非暂停路径**逐字不变**。

# 【v1.23.53 → v1.23.54】并行跑次也能被墙钟预算截住、也能续跑
#   ① 根因：`max_minutes` 原来只挂在 `_run_serial` 的**层间** ⇒ 并行模式
#      （A/B/C + D~H）设了预算也照跑到天亮（宿主一回收就全丢）；而续跑入口又
#      **硬拒非 serial** ⇒ 强杀后连"续"都续不了。**预算保护对并行是空的。**
#   ② 修法：`_wall_clock_over()` 收成唯一判据，**三个**单层执行器的圈边界都判
#      （`_run_layer` / C 模式 / `_run_layer_stage`）；到点 ⇒ 该层记进
#      `_paused_rest`，`stop_reason` 带「墙钟预算」标记 ⇒ 整跑变 `paused`。
#   ③ 续跑：`load_resume_snapshot` 不再拒绝并行快照，改为**摘掉**带标记的层
#      （截断层不算完成，要重跑）；`run()` 里并行续跑**一律按 serial 跑剩余层**，
#      产物记 `resumed_serial` —— **降级留痕，不静默**。
#   ★ 无新配置键；`max_minutes` 默认 0 / 不传 `resume_ckpt` ⇒ 逐字零行为差。
#   ★ 一个必须知道的细节：`stop_reason` 是**逐圈在循环体末尾**拼的，圈首 break
#     会跳过那一步 ⇒ 标记必须**直接盖到 view 上**（第一版只写了 note，判据当场
#     逮到"续跑什么都不重跑"）。

# 【v1.23.52 → v1.23.53】记忆库目录**一处解析**（bandit 不再偷偷写回仓库）
#   ① 根因（挂账「目录两处解析未收敛」）：episode/playbook 走 `playbook.dir`，
#      bandit 却只看 `auto.bandit.dir`、空则 `eml_dir()`（**恒指仓库**）⇒ 任何设了
#      `playbook.dir` 的调用方（冒烟、A/B 脚本、想隔离库的人）都会让 bandit
#      偷偷写生产库。冒烟隔离因此要三个旋钮，**漏一个就污染**。
#   ② 修法：新增唯一解析 `eml_store_dir(cfg)`，三处都走它：
#      `auto.bandit.dir`（显式，仍优先） ＞ `playbook.dir` ＞ 仓库根 `dgtf_memory/`。
#   ③ 为什么是**模块级函数**：bandit 的**载入**发生在实例属性 `_eml_cfg` 赋值
#      **之前**，用实例状态会静默回落到 `eml_dir()` —— 那正是要修的 bug。
#   ★ 无新配置键；生产默认（`playbook.dir` 空）解析结果与旧版**逐字相同**。
#     想给 bandit 单独指定目录仍然可以：`auto.bandit.dir` 优先级不变。

# 【v1.23.51 → v1.23.52】`paused` 跑次**不写 EML 库**（半程样本不是证据）
#   ① 根因：上一版只保证「不重复调用就不多写」。墙钟预算暂停的跑次仍写一条
#      **半程样本**；续跑跑完后同 run_id 又写一条完整样本（读数不同 ⇒ 幂等守卫
#      按设计放行）⇒ 一个跑次**两条证据**、`used_outcomes` 记两笔、weight 罚两遍。
#   ② 修法：`_eml_finish` 在 `off` 判完之后先判 `paused` / `pending_layers`，
#      命中即返回（`skipped_paused`）—— **连库目录都不建、也不去抢锁**。
#      判据取自产物本身（`run()` 在调本方法之前就写好了这两个键），
#      所以不依赖调用方传参，任何入口口径一致。
#   ③ 成本不会丢：`llm_calls` / `llm_tokens` 仍在产物与快照里 ⇒ 暂停/被杀的
#      跑次照样能结算。
#   ★ 无新配置键；`max_minutes` 默认 0 ⇒ 守卫条件恒假 ⇒ 默认行为逐字不变。

# 【v1.23.50 → v1.23.51】`_eml_finish` 幂等：**一个跑次只学一条 episode**
#   ① 根因（真跑逮到）：A/B 脚本把 `_eml_finish` 调了两次（`run()` 内部已调过一次）
#      ⇒ 每个跑次写出两条**完全相同**的 episode、`used_outcomes` 与 `weight` 被罚两遍
#      （实测 7 个条目 weight 多扣 0.05/次，事后要写清账脚本才能收拾）。
#      为什么 v1.23.48/49 没暴露：「run_id 必须在 `_eml_finish` 之前盖章」是上一版才修的
#      —— 在那之前内部那次拿到空 id，被「匿名跑次一律不写库」的闸挡掉。
#   ② 修法：拿到跨进程锁之后、写 episode 之前加守卫 —— 已有**同 run_id 且除 `t`
#      外逐字相同**的 episode ⇒ 直接返回（`dup_skipped`），不写库、不再罚 weight。
#   ③ 为什么判据不是「只看 run_id」：墙钟预算 `paused` 的跑次也会写一条半程样本，
#      续跑完成时它的读数不同 ⇒ **必须能写**，否则完整样本永远进不了库。
#   ★ 无新配置键；单次调用的行为**逐字不变**（不重复调用 ⇒ 守卫从不触发）。
#     想回到旧行为不需要改配置：多调一次 `_eml_finish` 即可（那正是要防的事）。

# 【v1.23.49 → v1.23.50】断点续跑 + 快照记账 + route 死捕获 + 墙钟预算
#   ① 根因（今天真事故）：A/B 真跑被宿主回收两次（18.2 / 12.7 分钟）——
#      v1.23.49 的快照只能「留痕」不能「接着跑」，而且连烧了多少都查不出来。
#   ② run(..., resume_ckpt=路径)：复用快照里**已完成的层**（不重跑、
#      不再花那部分钱），并还原它们的池（下游读上游池）。
#   ③ 快照加记账：`llm_calls` / `llm_tokens` / 各层 `rounds_run` ⇒ 被杀跑次也能结算成本。
#   ④ 快照里的 `route` 原为**死捕获**（引擎从不设 `_route`）⇒ 恒 `[]`；已修。
#   ⑤ run(..., max_minutes=N)：层间墙钟预算 ⇒ 优雅停（快照状态 `paused`）
#      + 产物交代 `pending_layers` ⇒ **分片跑完**，不撞宿主的回收窗口。
#   ★ 无新配置键（两项都是 `run()` 形参）⇒ 出厂行为逐字不变；
#     不传 `resume_ckpt` / `max_minutes=0` 时与 v1.23.49 逐字相同。

# 【v1.23.48 → v1.23.49】跑中快照 —— 新增配置键 runtime.live_checkpoint / runtime.ckpt_interval
#   ① 根因：Meta-DGTF.run() 是 60 分钟级长跑，packed 只在 return 前组装、调用方只在
#      返回后才写盘 ⇒ 宿主一回收进程，连层 0 的五圈都消失（12:37 真跑就这么丢了 ~24 分钟）。
#   ② 解法：run() 起 daemon 心跳线程，每 N 秒把 self._results（各层 View.to_dict）
#      **原子**落盘（tmp + os.replace ⇒ 强杀也不会留半份）⇒ 最多丢一个间隔。
#   ③ 孤儿回收：recover_orphan_runs() 把「起跑过但没收尾」的回填 interrupted + 原因。
#   ④ 新键 runtime.live_checkpoint：**用户已拍板默认 true（开）** —— 这是本项目
#      「新键默认关=零行为差」惯例的**唯一例外**，理由：它是纯安全网（daemon 心跳
#      线程 + 原子落盘），不影响任何引擎输出/结论，只决定「崩了能不能找回」；
#      而 12:37 真跑已用 ~24 分钟 / ~¥2 证明「默认关」的代价是**全丢**。
#      若要回到零行为差，设 false 即可（app 参数面板也能关）。

