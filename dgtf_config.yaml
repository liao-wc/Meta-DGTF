#   ① 实测：真产物 duty_trace = {S:0.0, C:0.25, R:0.0} ⇒ S=0 是被 R=0 拖的。
#      根因：C 用 _hit(问项, 全文) 计覆盖；R 用 _hit(问项, 单句) 计「直接段」。
#      _hit 的 gram 覆盖率按**问项长度**归一 ⇒ 问项**跨句**时 C 记、R 不记。
#   ② 修法：duty_of_layer / duty_components 加 span_tolerant 形参 —— True 时 R 的
