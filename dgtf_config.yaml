#       三票之间。**不再把单票路径印成「三态多票 high 0/low 0/一致率 0%」**。
#       分母只数**有判决的条**，判决官弃权的条单列。
#     · decision 取向的产物新增「不做什么」清单实际内容 —— 研究层
#       schema 增加了 not_do[]，rubric 第三项（不做什么）从此能拿到分。
#   怎么退回旧行为：
#     external_anchor.answers_min_len 置 0 → 不过滤（= v1.22.1 行为）；
