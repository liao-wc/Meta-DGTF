#     external_anchor.per_round: 2     ← 每圈最多并入几条锚点（元层不检索）
#     external_anchor.api_key_env / cache_ttl_hours
#         ← 真检索后端的 key 环境变量名 / 结果缓存小时数（key 不进本文件）
#     external_anchor.triage: false    ← 分诊降级：undecidable 的理由若是
#         「信息不足 / 需外部动作 / 缺数据 / 无外部」，而锚点里**有**材料
#         能答，该条降为 decidable 或 partial；「自指循环 / 无共同参照系 /
#         本体论判断」一律**不降**。
#     actions.tri_multi_vote: true     ← 子问题可判定性**三态多票**：同一条
#         问三个视角各判一次取多数；三票互异 = 无多数票 → 进校准队列
#         （不再是「每条都塞进队列」，队列只收真要人工核的）。
#     actions.landing_decision: true   ← 取向 decision 时，落脚段改渲染
#         「行动清单六字段（verb/object/owner_role/deadline_hint/
#         acceptance/fallback）+ 不做什么 + 决策 rubric」。
#         取向 boundary 或关掉本项 → 退回老模板（池级留痕两者共用，不丢）。
#     actions.input_sanity: true       ← 输入健全性自检（只报告、不改写）
#     actions.parallel_expand: true    ← 一次展开里多个 job 并发调 LLM
#     memory.self_layers_per_entry: 2  ← self 通道**每层**保留几条
#         （与 memory.self_layers 是两个口径，别当替代关系）
#     spiral.both_quota.{enabled,max_ratio,min_items}
#         ← both 占比超 max_ratio 就去问「缺什么」（**追问**，不动极性；
#           both_tighten_ratio 才是**改判**，两条语义完全不同）
#   行为变化（不需要改配置）：
#     · 产物头部多「分层目标（修行/研究/对撞/元）」「三态多票 / 冻结
#       签名」「机制审计」三段；日志同印。
#     · 硬约束 flag（action_incomplete / not_do_missing）不再被
#       quality_flags 的重算冲掉。
#   怎么退回旧行为：
#     actions.tri_multi_vote / actions.landing_decision /
#     actions.input_sanity / actions.parallel_expand 全置 false，
#     external_anchor 保持 enabled: false（默认即关）→ 与 v1.21.77 同。
#
# 【v1.21.55 → v1.21.56】
#   新增字段（都有默认值，旧的 dgtf_config.yaml 不改也能跑）：
#     spiral.both_tighten_ratio: 0.3      ← 展开后处理里 both 占比的
#                                           **改判**阈值。以前写死在
#                                           调用处。注意它与
#                                           spiral.both_quota.max_ratio
#                                           （默认 0.7）不是一回事：
#                                           前者动极性，后者追问缺什么。
#     spiral.alignment_similarity: 0.7    ← 四象限对齐的关键词相似度
#     spiral.alignment_containment: 0.6   ← 四象限对齐的包含度
#                                           （短的一侧有多少关键词落在
#                                            长的那侧；修行层的 target
#                                            短、研究层的 sub_question
#                                            长，只有这条可能对上）
#     【参数配置化 · 收拢魔法数字】新增三组（都带默认值）：
#       spiral.dedup_candidate_overlap: 0.65     ← 合并后二次去重：候选
#       spiral.dedup_candidate_similarity: 0.70
#       spiral.dedup_amp_overlap: 0.60           ← 合并后二次去重：& / 线头
#       spiral.dedup_amp_similarity: 0.62           （线头更容易近义改写，更松）
#       spiral.qc_rephrase_ratio: 0.5            ← 质量线索：ing 复述率触发线
#       spiral.qc_both_ratio: 0.6                ← 质量线索：候选 both 占比触发线
#       spiral.all_drift_threshold: 0.5          ← all 层候选跨层漂移触发线
#       spiral.all_selfref_threshold: 0.4        ← all 层候选自指触发线
#     其余散落的相似度阈值（0.85 / 0.75 / 0.62 / 0.8 …）已收拢成
#     模块顶部「判据阈值」命名常量，不再散落在调用点；其中 ing 复述
#     判定（_REPHRASE_*）有意不做配置项——样本只有 n=1，调它=过拟合。
#   行为变化（不需要改配置）：
#     · 停止理由不再一律叫「ing 复述」——拆成「ing 连续 N 圈复述」
#       和「自省连续 N 圈点名同一批问题未消化」两条，各说各的。
#     · md 自省段：ing 复述率 0% 也会打印（以前被 falsy 跳过）。
#     · md 的【自省回流核对】改成逐圈列出。
#     · md 的【闭环清算】补一行分母说明（已了结的不参与清算）。
#     · md 的【四象限对齐】未对齐时补「两侧各几条 / 最接近的一对几分」。
#     · md 的【悬置总览】同名条目合并，只显示最新状态并标注迁移。
#
# 【本文件是 DEFAULT_CONFIG 的完整覆盖层】
#   本文件把 DEFAULT_CONFIG 的键**列全**（冒烟 check_config_parses
#   会核「有没有漏键」）；值上与默认不同的那批手调（同步时 48 项）登记在
#   CONFIG_TUNED 里 —— 未登记的差异判红、过期登记也判红。
#   ★ 列全 ≠ 钉死：任何一项与当前默认值不符且未登记，冒烟立刻报红，
#     所以「默认改了而本文件没跟上」不会静默发生。
#
# 【参数优先级（高 → 低）】
#   ① 命令行参数（CLI）
#   ② 交互模式询问（无 CLI 参数时）
#   ③ 本 YAML 配置文件
#   ④ 代码 DEFAULT_CONFIG
#
# 【环境变量优先级（高于 api 段）】
#   DGTF_API_KEY        > OPENAI_API_KEY    > api.key
#   DGTF_BASE_URL       > api.base_url
#   DGTF_MODEL          > api.default_model
#   DGTF_REASONER_MODEL > api.reasoner_model
#
# 【分层说明】
#   api      —— API 连接
#   output   —— 展示开关（只影响日志/终端显示）
#   actions  —— 逻辑开关（决定"做不做某一步"）
#   probe    —— 探针筛选参数
#   memory   —— 三通道记忆参数
#   external_anchor —— 外部事实锚点（题外参照：不进池、不参与清算）
#   spiral   —— 螺旋停止 / 循环判据
#
# 【修改心法】
#   调"要不要做某事"   → 改 actions
#   调"要不要打印某事" → 改 output
#   调"跑多久 / 多严"  → 改 spiral
#   调"用哪个并行模式" → 改 actions.parallel_mode
#                        （serial/A/B/C/D/E/F/G/H/auto，auto 现在九选一）
#   调"B/C 预热几圈"   → 改 actions.parallel_warmup_rounds
#   调"要不要行动清单"   → 改 actions.landing_decision（取向 decision 时才生效）
#   调"子问题判得准不准" → 改 actions.tri_multi_vote（三态多票）
#   调"接不接外部事实"   → 改 external_anchor.*（v1.23.18 起默认**开**；
#                              没配 path 时零调用，「未挂文件」是干净态）
#
# ⚠️ 【曾经的坑 · v1.21.51 [fix-105] 已修】
#   --parallel 的 argparse default 原来是硬编码 "auto"，
#   不传也会覆盖本文件的 parallel_mode。现在 default=None，
#   不传 → 回落本文件；显式传 → 覆盖本文件。两条都对。
# ============================================================



# ------------------------------------------------------------
# 运行期总控（三层里的**最外层**：命令行 / 交互 / 本段）
# ------------------------------------------------------------
# 三项都是「人的当场决定」，默认 auto = 不覆盖任何既有键（行为不变）。
#   web      —— 联网总开关：auto / on / off
#               on  仍受 `web_search.stages` 的环节授权与配额约束；
#               off 一律不发起检索（也就不会有 W# 进引用表）。
#   thinking —— 思考总开关：auto / on / off
#               on  = **全部环节**开思考（成本显著上升，慎用）；
#               off = 全部环节关思考（覆盖 stages 表里的每一个键）。
#   effort   —— 思考强度：auto / low / high / max
#               只在思考开启时生效；取自 2026-10-02 实测可用集。
# ★ 「auto」的语义是「按本文件的既有键」，**不是**「跟上次一样」。
runtime:
  # 【用途】跑中快照（daemon 心跳线程周期性原子落盘）—— 修「run() 只在返回后写盘，
  #   崩了连层 0 都丢」。用户拍板**默认 true（开）**：纯安全网，不影响任何引擎输出/结论，
  #   只决定崩了能否找回；12:37 真跑已证明「默认关」= 全丢。要零行为差设 false 即可。
  # 【依据】今天 12:37 真跑被宿主回收，24 分钟 / ~¥2 全丢。
  live_checkpoint: true
  # 心跳间隔（秒）。越小丢得越少、IO 越多。
  ckpt_interval: 30.0

  web: auto
  thinking: auto
  effort: auto

# ------------------------------------------------------------
# API 连接
# ------------------------------------------------------------
external_input:
  enabled: true
  file_paths: []

claim_gap:
  enabled: true

api:
  # 【建议】留空，用环境变量。
  #   避免 API Key 进版本库。
  #   设置方法：export DGTF_API_KEY="sk-xxx"
  #           或写 .env 文件（代码会自动 load_dotenv）
  #
  # 【优先级】DGTF_API_KEY > OPENAI_API_KEY > 本字段
  key: ""

  # 【建议】保持默认 DeepSeek。
  #   换其他端点需测试兼容性（尤其是 response_format: json_object）。
  # 【环境变量】DGTF_BASE_URL 覆盖本字段
  # 【可选值】
  #   https://api.deepseek.com/v1      （DeepSeek，默认）
  #   https://api.openai.com/v1        （OpenAI）
  #   https://api.moonshot.cn/v1       （Moonshot）
  base_url: "https://api.deepseek.com/v1"

  # 【用途】大部分 LLM 调用（展开 / 对偶判断 / & 沉淀 / 探针 / self-check）
  # 【环境变量】DGTF_MODEL 可覆盖本字段
  #   ⚠️ 优先级校正（2026-10-02 实测）：实际是 **本文件 > 环境变量**。
  #      DEFAULT_CONFIG 里虽写了 os.getenv("DGTF_MODEL", ...)，但只要本文件
  #      显式给出 default_model，_deep_merge 就会把它盖掉。
  #      与旧注释宣称的「环境变量优先」相反，别再照旧注释行事。
  #
  # 【2026-10-02 迁移】原为 legacy 别名 "deepseek-chat"。
  #   官方公告该别名 2026-07-24 停服；实测当天仍可用（官方对老别名一向延期），
  #   但它是**第三方可控的间接层**：请求 deepseek-chat，返回体里的 model 却是
  #   deepseek-flash —— 实际服务者不受我们控制，且此前无任何留痕。
  #   现改显式 ID，语义对齐旧别名的实测行为（V4.1-Flash 非思考模式）。
  default_model: "deepseek-flash"

  # 【用途】需要长链推理的两处：ing 对撞 / view 显形
  # 【环境变量】DGTF_REASONER_MODEL 可覆盖本字段
  #
  # 【识别判据已废弃】_is_reasoner() 过去检查名字里是否含
  #   "reasoner" / "-r1" / "reasoning"。
  #   ⚠️ 换成任何新式 ID（deepseek-flash / deepseek-v4-pro）名字里都不含这些字，
  #      会被**静默判 False** → 不再强制 max_tokens≥32000（推理 token 会吃满
  #      预算导致 finish_reason=length）、json_mode 也会走错分支。
  #   现改为显式 thinking 开关，不再靠名字猜。
  #
  # ★ 本字段允许与 default_model **同名** —— 两者的区别只在下方 thinking 段，
  #   所以任何「拿 model 名反推是不是推理调用」的写法在这里都会失效。
  #
  # 【2026-10-02 迁移】原为 legacy 别名 "deepseek-reasoner"，现为显式 ID。
  reasoner_model: "deepseek-flash"

  # 【请求级思考模式】V4 系列起，thinking 是**请求参数**而不是另一个模型 ID。
  #   实测可用（2026-10-02）：type = disabled / enabled，effort = low / high / max
  #   ★ OpenAI SDK 的顶层 reasoning_effort= 参数会被吞掉、无效；
  #     必须走 extra_body={"thinking": {...}}。
  #   ★ 不写这段（或值为 null）= 用服务端默认 —— deepseek-flash 默认是
  #     **开思考**，那会把全部普通调用变成贵的思考模式，务必显式关掉。
  #
  #   default  —— 普通调用（对齐旧 deepseek-chat：非思考）
  #   reasoner —— 推理调用（对齐旧 deepseek-reasoner：思考）
  #   effort   —— 仅 type=enabled 时生效；null = 服务端默认力度
  #
  # 【逐环节思考档位】2026-10-02 拍板：需要的开，不需要的关。
  #
  # ★ 判据不是「生成长文本才需要」，而是「这一步是不是多步推理」。
  #   依据（§7.19）：有区分度的题上，非思考 0/4、思考三档都是 4/4。
  #   按老判据开的那两个（ing 对撞 / view 显形）恰好都是生成型 —— 那是
  #   历史遗留，不是因为生成更需要思考。
  #
  # ★ 硬约束已排除（§7.21）：思考模式下 response_format 不生效，JSON 只能
  #   靠 prompt 约束。实测真实 schema（嵌套数组 + 6 字段 + 理由）：
  #   思考档 5/5 可解析、5/5 结构完整 —— 所以判定环节开思考**可行**。
  #
  # ★ 代价：output 约 18 倍（349 → 6308 中位）。**不能全开**，只给真需要的开。
  #   高频环节（每层每圈都调）开思考会把整批成本抬到超支，故先关、待测量。
  #
  # 优先级：调用点显式传 thinking  >  本表按环节  >  default
  # 不在表里的环节 → 跟随 default（关闭）。
  thinking:
    default: "enabled"
    reasoner: "enabled"
    # low / high / max 在题库上正确率完全相同（§7.19），选最便宜的 low。
    # ⚠️ 该结论测于 v4-pro，flash 恢复后需重测确认（成本很低，64 次调用）。
    effort: "low"
    stages:
      # ── 开：多步推理，且判定质量直接进 X/Y ──
      auto_plan: "enabled"                # 五维规划决策，1 次/跑（v61 及以前的单次版）
      plan_orientation: "enabled"         # [v1.21.62 P2-8] 取向判读，1 次/跑
      plan_resources: "enabled"           # [v1.21.62 P2-8] 资源配置，1 次/跑
      adjudicate_sub_tristate: "enabled"  # 三态判决，决定 X（分子）

      # ── 开（2026-10-02 按报告先验开启）：多步推理判定，高频 ──
      #   ★ 这些是「先验需要」，不是「已实测验证」。依据：实测多步推理题
      #     上思考 4/4 vs 非思考 0/4（§7.19）；代价是 output ×18。
      #   ★ 余额已充到 ¥156，够跑；但仍须在专项对照批里用真实 X/Y 判据
      #     验证「开 vs 关」的质量差，不能只信先验。
      dual_judge: "enabled"               # 对偶判断，约 20~30 次/跑
      assess_decidability: "disabled"     # [v1.23.65] 实测思考 Δ0.0、tokens 467→625、延迟 2.5→8.8s ⇒ 关
      assess_decidability_from_pool_view: "disabled"  # [v1.23.65] 实测 Δ−0.167，无收益
      re_evaluate_pool: "disabled"        # [v1.23.65] 实测 Δ0.0，无收益

      # ── 关：简单映射 / 结构化罗列 / 输出本来就短，思考无收益 ──
      #   ★ [v1.23.2] 此前这 15 行的值误写成 "enabled"（注释写的是「关」）；
      #     而它们当时**从未生效**（调用点没传 stage=）⇒ 实际行为一直是「关」。
      #     本版改为 disabled：与注释一致、与实际行为一致，**行为零变化**。
      decide_parallel_mode: "disabled"
      check_input_sanity: "disabled"
      check_structure_saturation: "disabled"
      re_anchor: "disabled"
      ask_missing_polarity: "disabled"
      decompose_normal: "enabled"           # [v1.23.65] 实测思考 Δ+1.0（n=3）
      decompose_hybrid: "disabled"
      decompose_koan: "disabled"
      decompose_from_pool: "disabled"
      probe_research: "disabled"
      probe_duel: "disabled"
      probe_meta: "disabled"
      phase_probe: "disabled"
      self_check: "disabled"
      settle_research: "disabled"
      tool_preflight: "disabled"  # 工具预检（Search/Fetch tool calls）
      # [v1.23.2] 下面两个是「代码在传、配置此前没声明」的（按默认值列出）。
      adjudicate_sub_tristate_multi: "disabled"   # 三态多票判决（3 票）
      tri_test_retest: "disabled"                 # 三态 test-retest 重测
      anchor_crosscheck: "disabled"               # 锚点交叉核对

  # 【建议】≥ 180。
  #   reasoner 输出长，单次可能 60-120 秒。
  #   太小会导致频繁超时重试，反而更慢。
  timeout: 240

  # 【建议】
  #   网络稳定：3
  #   网络不稳：5
  # 【注意】太大拖慢失败感知；每次重试等待 backoff^n 秒。
  max_retries: 3

  # 【建议】1.8
  #   第 n 次重试等待 backoff^n 秒。
  #   1.8 → 1.8 / 3.24 / 5.83 秒。
  # 【注意】别小于 1.5，否则可能被 API 限流。
  retry_backoff: 1.8

  # 【v1.23.66】严格 JSON 自修复：解析失败时多做一次低温修复调用，
  #   只修格式、不改语义。默认 false（零行为差）；本机开 true，
  #   把「答了但答不成结构」救回来（成本计入 ops，不混进跑本身）。
  json_repair: true


# ------------------------------------------------------------
# 展示开关（只影响日志 / 终端显示，不影响逻辑）
# ------------------------------------------------------------
output:
  # 【用途】结果保存目录。相对当前工作目录。
  # 【产物】outputs/YYYYMMDD_HHMMSS_<问题前20字>.md
  #         outputs/diagnostic_position_*.log（position_all_same 时）
  save_dir: "outputs"

  # 【建议】
  #   开发调试：true（详细日志，好定位）
  #   批量生产：false（只打印 view 显形和最终摘要）
  # 【影响】false = 安静模式
  verbose: true
  dump_rounds: false

  # 【答案门】答案是否**针对本题**（另带跨视角一致性警示）。
  # 【为什么】就绪门拦得住「空」，拦不住「偏」—— 实测三个反例都 answer_ready=True：
  #   心率题答了定义（coverage 却 1.00）、HTTP 503 答成 Retry-After 头（0.90）、
  #   HTTP 301 答「指定网址的方式」（0.50）。coverage 是子问题作答率，不是正确性。
  # 【本机选择】block: true —— 相关性不过的跑次直接判未就绪。
  # 【回退】block: false ⇒ 只写 quality.answer_gates 读数，判定一字不改。
  # 【注意】agreement（α 低）**只警示不阻断**：α 低是三层真实分歧，不是答案错的
  #   证据；实测拿它阻断会误杀 108 个正确答案。
  answer_gates:
    enabled: true
    block: true

  # 【用途】是否打印对偶判断的每条候选细节。
  # 【建议】
  #   调对偶判断时：true
  #   日常：false（可减 80% 输出）
  show_dual_judge: true

  # 【用途】是否在终端完整打印 ing 输出全文。
  # 【注意】ing 通常 1000-2000 字，全开会淹没终端。
  # 【建议】
  #   默认：false
  #   调试对撞质量：临时开
  # 【CLI 覆盖】--show-ing
  show_ing: false

  # 【用途】是否在终端完整打印 view 显形全文。
  # 【注意】view 通常 800-2000 字，全开会淹没终端。
  # 【建议】
  #   默认：false
  #   想直接读终端：临时开
  # 【CLI 覆盖】--show-view
  show_manifest: false

  # 【用途】对偶判断后回看一遍（LLM 自省）。
  # 【建议】
  #   质量优先：true
  #   速度优先：false（每圈省 1 次 LLM 调用）
  # 【⚠️ 重要】关闭后 streak 机制失效：
  #   _rephrased_streak / meta_idle_streak 不累积，
  #   fix-72 v3（对撞/元层 ing 复述直接判 idle）不再触发，
  #   对撞层/元层可能跑得更久。
  # 【CLI 覆盖】--no-self-check
  self_check: true

  # 【用途】探针 covers 字段诊断日志。
  # 【行为】
  #   false（默认）：只打印异常（字段缺失 / 类型非 list）
  #   true：每次探针都打印 covers_raw → parsed
  # 【建议】只在排查 "探针为什么没 covers" 时开。
  # 【典型日志】
  #   [fix-89 diag] 探针 covers_raw=['T1','T3'] → parsed=['T1','T3']
  #   [fix-89 diag] 探针 covers 字段缺失（模型未输出）
  show_probe_diag:  true


# ------------------------------------------------------------
# 逻辑开关（决定"做不做某一步"）
# ------------------------------------------------------------
actions:
  # ---------- 层间调度 ----------

  # 【用途】输入健全性自检（v1.21.50 [P1-6] 引入）。
  #   「PN 不是任何标准复杂度类」那次事故：引擎不知道，把一个可能
  #   是笔误的符号当合法对象收下，跑了 168 次调用。
  # 【建议】保持 true。
  # 【注意】只报告、不改写 —— 替用户改写问题等于替他决定想问什么。
  # 【关闭后】本步不跑，产物里 input_sanity 段为空。
  input_sanity: true

  # 【用途】是否做全局可判定性评估。
  # 【建议】保持 true。
  # 【关闭后】decidability_result 默认 decidable，所有层按"可判定"处理。
  assess_decidability: true

  # 【用途】是否做子问题分解（研究层专用）。
  # 【建议】保持 true。
  # 【关闭后】研究层无 sub_questions，双通道产物退化。
  decompose_question: true

  # 【用途】评估来源（三选一）。
  # 【可选值】
  #   "pool"       —— 从修行池读，并与外部评估合成（最稳，推荐）
  #   "external"   —— 只用外部评估（0 和 1 可并行，A 模式前提）
  #   "pool_only"  —— 只用池评估（省 1 次 LLM 调用）
  # 【选择逻辑】
  #   pool        → 必须先跑 0 层，从修行池读评估
  #                 + 同时跑外部评估，两路合成
  #   external    → 跳过池读，只用外部评估
  #   pool_only   → 只用池评估，不跑外部
  # 【⚠️ A 模式】会被强制改为 external（B~H 有 0 层预热，能走 pool）。
  #   池还没产物），本字段的配置不生效。
  decidability_source: "pool"

  # 【用途】分解来源（二选一）。
  # 【可选值】
  #   "pool"     —— 从修行池探针/&/悬置里生发研究子问题（推荐）
  #   "external" —— 从问题本身重新拆解
  # 【选择逻辑】
  #   pool     → 从修行层产物长，继承修行成果
  #              要求 0 层先跑完（层间依赖强）
  #   external → 从问题本身重新拆解
  #              好处：0 和 1 可并行
  #              坏处：修行层白跑（研究层不继承修行成果）
  # 【⚠️ A 模式】会被强制改为 external（B~H 有 0 层预热，能走 pool）。
  decompose_source: "pool"

  # 【用途】子问题可判定性的**三态多票**（v1.22 引入）。
  #   同一条子问题问三个视角各判一次（decidable / partial /
  #   undecidable），取多数票；三票互异 = 无多数票 → 进校准队列。
  # 【建议】保持 true。
  # 【关闭后】退回单票判定，产物无 tri_consensus / calibration_queue。
  tri_multi_vote: true
  # [v1.23.2] 三票里某票返回**合法 dict 但 judgments 为空**时的重试次数。
  #   ★ 空票是**失败**不是弃权（实测 10 跑里 4 跑因此只有 2 票可用）。
  tri_vote_retry_empty: 1

  # ---------- ★ v1.21.54 并行模式 ----------
  # 【用途】四层执行策略。
  # 【可选值】
  #   "serial" —— 严格串行（0→1→both→all），最稳（原逻辑）
  #   "A"      —— 四层独立并行 + 汇流圈，快
  #   "B"      —— 轮次并行（Jacobi），每波 barrier，读上一波定格
  #   "C"      —— 流水线并行，只等上游交出第一圈，之后各跑各的
  #   "D"      —— 0∥1 各自跑完 → both 起 → both 出圈后 all 跟上
  #   "E"      —— 0∥1 各自跑完 → both 跑完 → all 起
  #   "F"      —— 0 跑完 → 1 出圈 both 跟上 → both 出圈 all 跟上
  #   "G"      —— 0 跑完 → 1 出圈 both 跟上 → both 跑完 all 起
  #   "H"      —— 0 跑完 → 1 跑完 → both 起 → both 出圈后 all 跟上
  #   "auto"   —— 由 Meta-DGTF 按问题性质自动决策
  #
  # 【★ D~H 的一句话区别】只差"哪一层必须先收工"：
  #   记 waits 的层 —— 它**跑完所有圈**下游才动（硬闸）
  #   记 gates 的层 —— 它**交出第一圈**下游就动（软闸）
  #   表在源码 _MODE_GRAPH 里（每个模式 4 行），加新排布改表即可，
  #   跑圈/停止/合并逻辑五档共用同一套（_run_one_round_B）。
  #
  #   ┌────┬──────────────┬──────────────┬────────────────────┐
  #   │模式│ 修行 0       │ 研究 1       │ 对撞 both / 元 all │
  #   ├────┼──────────────┼──────────────┼────────────────────┤
  #   │ D  │ 立即 ∥ 1     │ 立即 ∥ 0     │ both 等 0+1 跑完   │
  #   │    │              │              │ all 等 both 出圈   │
  #   │ E  │ 立即 ∥ 1     │ 立即 ∥ 0     │ both 等 0+1 跑完   │
  #   │    │              │              │ all 等 both 跑完   │
  #   │ F  │ 立即         │ 等 0 跑完    │ both 等 1 出圈     │
  #   │    │              │              │ all 等 both 出圈   │
  #   │ G  │ 立即         │ 等 0 跑完    │ both 等 1 出圈     │
  #   │    │              │              │ all 等 both 跑完   │
  #   │ H  │ 立即         │ 等 0 跑完    │ both 等 1 跑完     │
  #   │    │              │              │ all 等 both 出圈   │
  #   └────┴──────────────┴──────────────┴────────────────────┘
  #
  # 【auto 决策逻辑】
  #   调 LLM 读问题性质，返回模式 + 理由 + 置信度。
  #   低置信（< 0.5）退回 serial。
  #   经验映射：
  #     明确单一问题           → serial
  #     多分句 / 并列          → A
  #     含"或/还是"/过程性      → B
  #     层界清楚、只想快        → C
  #     0/1 互不依赖、撞点是关键→ D
  #     同上 + 元层要最终对撞   → E
  #     修行是地基、后三层接力  → F
  #     元层要清算完整对撞      → G
  #     研究要吃完整修行        → H
  #     拿不准                 → serial
  #
  # 【九模式对比】
  #   ┌────────┬──────────────┬──────┬──────────────────────┐
  #   │ 模式   │ 层间关系     │ 并行 │ 可复现性             │
  #   ├────────┼──────────────┼──────┼──────────────────────┤
  #   │ serial │ 跑完才起     │ 1×   │ ✅                   │
  #   │ A      │ 互不读+汇流  │ 4×   │ ✅                   │
  #   │ B      │ 每波 barrier │ 4×   │ ✅                   │
  #   │ C      │ 首圈放行     │ ~4×  │ ❌ 时序依赖          │
  #   │ D      │ 0∥1→撞→元   │ ~2×  │ ❌ all 读活对撞      │
  #   │ E      │ 0∥1→撞→元   │ ~2×  │ ⚠️ 1 与 0 并发抢池   │
  #   │ F      │ 全流水       │ ~2×  │ ❌ 时序依赖          │
  #   │ G      │ 撞毕收元     │ ~2×  │ ❌ both 读活研究     │
  #   │ H      │ 逐层接力     │ ~2×  │ ❌ all 读活对撞      │
  #   └────────┴──────────────┴──────┴──────────────────────┘
  #   D/E 的"0∥1 并发"有个副作用：研究层读修行池分解子问题时，
  #   修行层可能正在往池里写 —— 严格讲是竞态。
  #   想要完全去掉它，把 parallel_warmup_rounds 设到 ≥0 层 hard_max
  #   （0 层整层先行），或改用 F/G/H。
  #
  # 【曾经的坑 · v1.21.51 [fix-105] 已修】
  #   --parallel 的 argparse default 原来是硬编码 "auto"，
  #   不传也会覆盖本字段。现在 default=None，
  #   不传时回落本文件的 parallel_mode —— 本字段真正生效。
  #   显式传 --parallel 仍然覆盖本字段（这是想要的）。
  #
  # 【CLI 覆盖】--parallel serial|A|B|C|D|E|F|G|H|auto
  # 【交互模式】会单独询问，回车用 auto
  parallel_mode: "auto"

  # 【用途】一次展开里多个 job（阴/阳、&/线头）**并发**调 LLM。
  # 【建议】true —— 每层每圈省一次往返。
  # 【关闭后】job 串行执行：调用数不变、耗时变长（排查限流时用）。
  parallel_expand: true
  # ★ [第六期 · 降本 L1] 阴阳合并成一次调用（默认 false ⇒ 零行为差）。
  #   打开后：阴阳两臂共用一次 LLM 调用（省 1 次往返 + 1 份重复 user 输入）。
  merge_expand: true
  # 【Phase5 · L0-v2】默认 archive：只读档案/novelty，不改生成、不裁剪。
  #   guide=下一圈可选提示；filter=旧硬裁剪（已否决）。
  l0_v2_curate: true
  # archive=只读档案/novelty（恢复默认）；guide=可选提示；filter=旧硬裁剪（已否决）
  l0_v2_mode: archive
  # 【F2 · all 元层闭合】四层真跑 5/5（成本 5/5 在 600k）；默认开。
  all_v2: true
  # 【F3 · 1 层 AnswerSet】四层 full-4 真跑通过；默认开。
  one_v2: true
  # 【F4 · both 论证】四层 full-4 真跑通过；默认开。
  both_v2: true
  # 【F5 · 0 层生成】生成 aspect/probe/novelty + 只读审计；默认开。
  zero_v2: true
  # 三态可靠性：同 prompt 重测 2 次（默认关；开启才可判 test-retest）
  tri_test_retest: false

  # ---------- ★ v1.21.54 B~H 的 0 层预热 ----------
  # 【用途】B/C/D/E/F/G/H 模式下，0 层先单独跑几圈做预热，
  #         再带着进度回到并行队列（A 模式不看本字段）。
  #
  # 【为什么需要】不预热的话：
  #   · 研究层第 1 圈读不到修行池 → decompose_source 退回 external，
  #     修行层等于白跑，研究层不继承修行成果；
  #   · 对撞层第 1 圈没有两侧可对齐 → 只能写空对齐占位；
  #   · 可判定性只能拿问题字符串本身当判据。
  #
  # 【可选值】
  #   1（默认）—— 只预热一圈，之后 0 层从第 2 圈接着跑。
  #               正确性（走池路径）和时间（不整层串行）两头都要。
  #   0        —— 完全不预热。
  #               代价：可判定性退回 external，研究层退回外部分解。
  #   ≥0 层 hard_max —— 整层先行（v1.21.52 的行为）。
  #               最稳也最慢：0 层那段是完全串行的瓶颈。
  #
  # 【D/E 特别注意】这两种模式用户描述是"修行和研究一起开始"。
  #   本字段默认 1 时，修行层先跑一圈，研究层晚一圈才出发 ——
  #   换来研究层能读到修行池、可判定性走 pool+external。
  #   要字面意义的严格同时出发：把本字段设 0（代价见上）。
  #
  # 【调法】
  #   在乎可判定性判得准 → 2 ~ 3（池里材料更多，池视角判定更准）
  #   在乎速度           → 1
  #   做对照实验          → 0 与 ≥hard_max 各跑一遍对比
  parallel_warmup_rounds: 3

  # 【用途】C/D/E/F/G/H 模式层间放行的最长等待（秒）。
  #         上游线程崩了或卡死时不至于把下游一起吊死。
  #         每层线程 finally 里都会放行，超时只是双保险。
  # 【建议】900。
  # 【调大】单次 reasoner 调用经常逼近 api.timeout 时往上调。
  pipeline_gate_timeout: 900

  # ---------- 层内动作（每层每圈依次执行）----------

  # 【用途】是否重述锚点。
  # 【建议】true。
  # 【关闭后】锚点用原文，省 1 次 LLM 调用/圈。
  re_anchor: true

  # 【用途】阴视角展开（0 端）。
  # 【建议】true。关了候选会偏向一边。
  expand_yin: true

  # 【用途】阳视角展开（1 端）。
  # 【建议】true。关了候选会偏向一边。
  expand_yang: true

  # 【⚠️ 强烈建议不要关】DGTF 核心机制。
  # 【用途】对偶判断：判候选的 position（0/1/both）。
  # 【关闭后果】全部候选 position=0，& 无出生。
  dual_judge: true

  # 【⚠️ 强烈建议不要关】DGTF 核心机制。
  # 【用途】ing 对撞（六步展开）。
  # 【关闭后果】无对撞，& 沉淀无输入。
  ing: true

  # 【⚠️ 强烈建议不要关】DGTF 核心机制。
  # 【用途】& 沉淀（提取 & 印记 / 线头 / 元反思）。
  # 【关闭后果】池子不长。
  he: true

  # 【用途】探针回归（生发下一圈 seeds）。
  # 【建议】true。
  # 【关闭后果】无 seeds，下一圈从零开始。
  phase_probe: true

  # 【用途】view 显形（生成 manifest）。
  # 【建议】true。
  # 【关闭后】view 全为"（manifest 动作已关闭）"，省 1 次 reasoner 调用/圈。
  manifest: true

  # 【用途】落地决策模板（v1.22 引入）。
  #   取向为 decision 时，落脚段渲染「行动清单六字段（verb / object /
  #   owner_role / deadline_hint / acceptance / fallback）+ 不做什么 +
  #   决策 rubric」，而不是原来的 boundary 留痕模板。
  # 【建议】true。
  # 【关闭 / 取向 boundary】退回老模板（池级留痕两个模板共用，不丢）。
  landing_decision: true

  # 【用途】self-check（自省）。
  # 【⚠️ 与 output.self_check 是同一个开关】。
  # 【建议】true。
  # 【关闭后果】streak 机制失效（fix-72 v3 不触发）。
  self_check: true

  # ---------- 池维护 ----------

  # 【用途】每圈重估池中 & / 线头的极性。
  # 【建议】true。
  # 【关闭后果】池极性永远 "?"，polarity_all_same 误报，
  #             探针筛选的极性加权失效。
  re_evaluate_pool: true

  # 【用途】研究层跑完后债务终局清算。
  # 【建议】true。
  # 【关闭后果】延迟债务悬空（clean=False）。
  settle_research: true


# ------------------------------------------------------------
# 探针筛选参数
# ------------------------------------------------------------
sim:
  # 【用途】池内去重阈值。两条 amp / thread / probe 的相似度达到它就不重复入池。
  # 【来源】v1.23.25 及以前是 `Pool.merge` 函数体里的**硬编码字面量 0.9**；
  #         v1.23.26 提为可配（默认值 = 原字面量 ⇒ 行为零变化）。
  # 【建议】
  #   默认 0.9
  #   池子膨胀、重复条目多 → 0.85 ~ 0.88
  #   池子偏小、怕误挡       → 0.92 ~ 0.95
  dedup: 0.9

  # 【用途】悬置目标的去重阈值（与新目标比对）。
  # 【来源】v1.23.25 及以前是 `Pool.merge` 里的**硬编码字面量 0.85**。
  # 【建议】
  #   默认 0.85
  #   悬置重复合并太狠 → 0.9
  dedup_susp: 0.85

  # 【用途】D3 语义熵聚类阈值：同一主张的多次出现，sim3 ≥ 它
  #         视为「同一个说法」（并入同簇）。簇越多 ⇒ 该主张越发散。
  # 【来源】v1.23.27 新增（`_SEM_CLUSTER_THR`）；此前语义熵未落地。
  # 【建议】
  #   默认 0.70
  #   太容易并簇（把分歧读成一致）→ 0.75 ~ 0.80
  #   太难并簇（同义反复也判发散）→ 0.60 ~ 0.65
  # 【注意】这是**观测**用的尺子，不直接判优劣 —— 调它只改读数。
  cluster: 0.70

probe:
  # 【用途】探针最低 expected_gain，低于此值丢弃。
  # 【建议】
  #   默认 0.3
  #   探针总为空     → 0.2
  #   探针质量差     → 0.4 ~ 0.5
  min_gain: 0.5

  # 【用途】每圈从新探针中筛出几条进下一轮。
  # 【建议】
  #   默认 3
  #   圈数少但想多跑 → 5
  # 【注意】太多会稀释注意力。
  select_n: 5

  # 【用途】E2 子模批选开关。true ⇒ 用贪心 + 边际下限挑探针
  #         （宁少勿滥：边际 G 低于下限就停手，不凑数）；
  #         false ⇒ 退回旧的「按模型自报 gain 排序取前 n」。
  # 【来源】v1.23.27 新增。
  # 【建议】
  #   默认 true
  #   【注意】算不出 G（未决 < 2 条）时会**自动退回**旧路径，
  #    所以打开它不会让「池子太小」的圈跑不动。
  submodular: true

  # 【用途】E6 自适应停止阈值：本轮所有候选探针的 expected_gain
  #         都低于它 ⇒ 记一条停止信号（本轮只出不进，
  #         探针数 0 是**合法**的）。
  # 【来源】v1.23.27 新增（`_GAIN_STOP_FLOOR`）。
  # 【建议】
  #   默认 0.02（刻意压低：停止是强动作，宁可多跑一圈也别误停）
  #   想更早收手省算力 → 0.05 ~ 0.10
  # 【注意】它与 `min_gain` 是**两把尺子**：min_gain 管「模型自报
  #   值不值得做」，stop_floor 管「还能不能推得动」。
  #   两者都低 ⇒ 停止信号；`max_gain == stop_floor` **不算**停。
  stop_floor: 0.02

  # 【用途】E2 子模批选的**边际下限**：一条候选的边际增益（子模条件化后的
  #         G）低于它 ⇒ 停手（「宁少勿滥」的核心分支）。
  # 【来源】v1.23.28 修正。★ v1.23.27 时引擎常量是 **0.0**，而
  #         `G ∈ [0,1]` + `if _best_g < _fl:` ⇒ 该分支**结构性不可达**
  #         （守卫等于不存在）。本版把引擎常量改为 0.02，与本键同值。
  # 【建议】
  #   默认 0.02
  #   想让批选更保守（少选）→ 0.05 ~ 0.10
  #   ⚠️ 设为 0.0 会让「宁少勿滥」**失效**（退回「有候选就选」）。
  marginal_floor: 0.02


# ------------------------------------------------------------
# 信念条目（D1/D2）参数
# ------------------------------------------------------------
belief:
  # 【用途】`revoked`（被质疑推翻）需要多少个**不同攻击来源**、
  #         且跨多少圈独立复现。与 `stable` 用**同一把尺子**（独立性）。
  # 【来源】v1.23.28 新增（`_BELIEF_REVOKE_SOURCES`）。
  #   ★ 改前的规则是 `len(atk) >= len(sup)`；真实入口下 `support` 每圈
  #     恒 +1（每层一个来源）、`attack` 每圈至多 +1 ⇒ 该条件**只在
  #     「每圈都攻击」时成立**（「攻击面 ≥ 支持面」退化成「攻击从未缺席」）。
  #     本版改为「攻击也要跨 ≥2 个不同来源独立复现」。
  # 【建议】
  #   默认 2（与 `stable` 的 `_BELIEF_STABLE_SOURCES` 对称）
  #   ⚠️ 设为 1 ⇒ 「同一来源反复骂」也会判 revoked（不推荐）。
  revoke_sources: 2

  # 【用途】D3 语义熵的**聚类阈值**：判定「两种说法是不是同一主张」的
  #         相似度门槛（`_sim3` 口径）。
  # 【来源】v1.23.28 新增（`_SEM_CLUSTER_THR`）。
  #   ★ 为什么**必须独立于 `sim.cluster`（0.70）**：那个键是 **E2 探针
  #     批选**的口径（把「同一个探针」聚起来），与本键不是同一件事。
  #     `_sim3` 在中文上走**字符二元组 Jaccard** ⇒ 实测同一主张换个说法
  #     只有 0.41~0.79、不同主张 0.00。沿用 0.70 的后果是**簇恒为单元素**
  #     ⇒ 语义熵恒 `None`（真跑 + 直测共同证实的退化）。
  # 【建议】
  #   默认 0.30（实测「同主张 0.41~0.79 / 不同主张 0.00」两组的空隙内，
  #   长句重述上偏保守：宁可少聚，不把不同主张混进同一簇）。
  #   ⚠️ 调高到 0.70 ⇒ 语义熵退化成恒 `None`（= 观测失效，不是「更严」）。
  sem_entropy_thr: "rel"
  # 【v1.23.29】语义归并开关/阈值（默认关 / 0.85 ⇒ 出厂零行为差）。
  #   开 ⇒ 换说法重提被记为已存在条目的一次复现；merge_log 落产物。
  #   0.85 是刻意的高门槛：不同主张 0.00~0.79 够不到（宁可漏并，不错并）。
  merge_semantic: true
  merge_sim: 0.85

# 【v1.23.30】层职责守卫（LDG）—— 三读数 C/R/S 在**停止/收敛处**实算。
#   floor：职责度下限。低于它 ⇒ 不许把「职责未尽」写成「自然安住」，
#          并在落地层点名「未答的核心问项」。V2.2.1 起默认 0.15（规则命中版 R 的校准）。
#   tau / patience：连续 patience 圈边际增益 ΔS<tau ⇒ 记「职责增益收敛」
#           （新增停止理由，治「体力耗尽」截断）。默认 0.02 / 2。
#   remedy_rounds：缺失 core 问项并入后续层 carry（默认 1；0 = 关）。
duty:
  # 【用途】职责 S 口径对称化：R 的「直接命中」用跨句窗口（修 C 全文/R 逐句 的不对称）。
  # 【建议】false（出厂=关=逐字不变）；想让跨句问项在 R 里也算命中可设 true。
  # 【依据】真产物实测：C=0.25 而 R=0.0 ⇒ S 被和均值拖到 0。
  span_tolerant: true

  floor: 0.15
  tau: 0.02
  patience: 2
  remedy_rounds: 1

# 【v1.23.31】EML 经验记忆回路 —— 记忆库默认落在仓库根 `dgtf_memory/`。
#   mode：
#     off    = 不读不写（完全关）
#     shadow = **出厂默认**：跑完照常记录 episode 与候选经验（过闸后进
#              `shadow` 状态），但**不生效** ⇒ 行为与 off 逐字相同，
#              差别只在「留下了库」。先观察几跑再切 on，是刻意的保守。
#     on     = 生效：只改写 **调度**（截断过的层 +1 圈）与 **守卫阈值**
#              （duty.floor）。★ 绝不注入答案内容。
#   top_k / promote_n：每次读几条 / 同向证据几次才 shadow→active（默认 3）。
#   halflife_days：检索排序（RRIF 的 recency 维）与遗忘清扫共用（默认 14）。
# 【v1.23.33】两个 opt-in 开关（默认都关 ⇒ 零行为差）。
#   stop.anytime_alpha: 0.0 = 关；>0 才启用 anytime-valid 停止判据（δ）。
#   auto.bandit.enabled: false = 关；true 才用预算 bandit 选圈数上限档。
stop:
  # 【用途】单标量早停阈值：refinement_gain < 它连续 N 圈 ⇒ 判「迭代饱和」停止。
  # 【建议】0（出厂=关=逐字不变）；想省尾段圈可试 0.01。
  # 【依据】arXiv:2608.10729（自反式迭代的最优停止 = 单一阶段无关阈值）。
  gain_floor: 0.0

  anytime_alpha: 0.05
  # 【v1.23.64】anytime 判据的统计口径：
  #   hoeffding（出厂默认，逐字不变）/ evalue（e-process，样本更省，同样对任意停时有效）。
  anytime_mode: hoeffding

playbook:
  llm_feedback:
    enabled: true
    max_candidates: 3
  mode: "on"
  dir: ""
  top_k: 3
  promote_n: 3
  halflife_days: 14.0
  # 无 run_id 的跑次是否也入库/参与学习（默认 false = 不收，见上文）。
  learn_from_anon: false
  # 【v1.23.64】论证冲突裁决：默认关 ⇒ 出厂零行为差。
  #   true 时对同 (kind, cond) 但动作不同的条目做 grounded/负担裁决，
  #   只写 arg_status / defeated_by 标签（不删行、不改 status）。
  argumentation:
    # 【v1.23.66】打开：只给冲突条目标 arg_status/defeated_by，
    #   召回时排除 defeated（行仍在盘上，不删、不改 status）。
    enabled: true
    semantics: grounded


# ------------------------------------------------------------
# 自调优（AutoTune）：跨跑设计空间调优（模式 / 层集 / 圈数）
# ------------------------------------------------------------
# 【用途】从 dgtf_memory/episodes.jsonl 历史跑次里推**建议默认**：
#   · 层集取舍用**帕累托前沿**（质量↑/成本↓，不做加权标量化）；
#   · 同质量（不低于最优 − quality_tau）内取**成本最低**那条（帕累托膝盖）；
#   · 圈数以「该层未被截断的中位 rounds_cap」为基线，被截断过的层 +1。
# 【口径】★ 只**建议**、不自动改行为：写回默认由显式 apply 执行。
# 【字段】min_n=同(模式,层集)至少几次真跑才进榜；quality_tau=层集取舍容差；
#         out=建议落盘路径（空=仓库根 dgtf_autotune.json）。
#
# ── 2026-10-14 首轮真跑 sweep 结论（P1 两层 / P2 四层 / P3 三层 × 2 题，
#    3 并发，全开配置；详见 `_autotune_v12333_结论.md`）──
#   数据（同分母 n=2~3）：
#     · 两层 ['0','1']      质量中位 0.000   成本中位 378,837 tok
#     · 三层 ['0','1','both'] 质量中位 0.056   成本中位 630,894 tok
#     · 四层 ['0','1','both','all'] 质量中位 0.010 成本中位 1,136,932 tok
#   ① **加层不加质量、只加钱**：四层比两层贵 **2.9~3.0×**，duty 无改善
#      （同题配对看方向还不一致）；对撞层 `both` 在四层/三层里**恒 0.0**。
#   ② **圈数默认被数据验证**：AutoTune 推 {0:5,1:4,both:5,all:5}，与引擎
#      `_AUTO_ROUNDS_BASE` {0:4,1:4,both:5,all:6} 基本一致 ⇒ **不改**。
#   ③ **不改默认层集**：证据薄弱（同分母 n=2，AutoTune 已自标 `证据薄弱`），
#      不足以推翻「默认全四层」；且 `orientation=auto` 本来就会按可判定性砍层。
#   ④ 本轮**唯一**据数据收紧的默认：`min_n` 1 → **2**（同(模式,层集)至少 2 次
#      真跑才进榜，避免单点读数主导膝盖取舍）。
autotune:
  min_n: 2
  quality_tau: 0.05
  out: ""


# ------------------------------------------------------------
# 三通道记忆参数
# ------------------------------------------------------------
memory:
  # 【用途】EML 语义近重合并：同 kind+cond.issue+action.key 就并入（防值差另开一条）。
  # 【建议】false（出厂=关=逐字不变）；库开始冗余堆积时可设 true。
  # 【依据】noisy accumulation / redundancy 是记忆学习点名的失败模式。
  eml_semantic_merge: false

  # 【用途】EML 阈值冷启自适应：库小时降晋升门槛，让学习闭环能启动。
  # 【建议】false（出厂=关=逐字不变）；想让早期学习生效可设 true。
  # 【依据】ReasoningBank / MemRL：cold start + static thresholds 是失败模式。
  eml_adaptive: false

  # 【用途】三通道：
  #   content —— 内容通道：读上游 View 的形状（candidates/amps/threads）
  #   context —— 背景通道：读上游已跑层的摘要
  #   self    —— 自我通道：**单次运行内**各层 view 的自我累积（四段式）。
  #               ★ 它**不跨问题、不跨会话**：self_text 是进程内 list，
  #                 每次 run 重置，交互模式每题新建一个 Meta-DGTF。
  #                 （原文写「跨问题累积」，与实现不符；v1.21.60 更正。）
  #
  # 【建议】不要关 content。
  #   context / self 可视情况关（省 prompt 长度）。
  #
  # 【关闭影响】
  #   关 content → 展开/对偶判断看不到池和历史，退化为"每次从零开始"
  #   关 context → 对撞层看不到修行/研究的来路，可能误判张力
  #   关 self    → 无跨问题记忆，单次运行不受影响
  #
  # 【全关】用 [] 或 ["none"]
  # 【CLI 覆盖】--channels content,context,self
  channels: ["content", "context", "self"]

  # 【用途】self 通道保留最近几层的记忆。
  # 【建议】4。
  self_layers: 4

  # 【用途】self 通道**每层**保留几条（v1.21.50 [P1-4] 引入）。
  #   以前是「最近 self_layers 条」，0 层刷屏会把研究层的挤掉；改成
  #   每层各留本项条数，再按（圈序, 层序）交错。
  # 【建议】2。
  # 【注意】与 self_layers 是**两个口径**：总条数 ≈ 本项 × 参与的层数。
  self_layers_per_entry: 2

  # 【用途】池形状注入 prompt 时最多几条。
  # 【建议】6。
  # 【调大】给 LLM 更多上下文，但 prompt 变长。
  shape_items: 10

  # 【用途】每条形状截断字符数。
  # 【建议】900。
  shape_chars: 1200

  # ---------- ★ v1.21.55 自省回流（[P1-5] 引入，[P2-7] 修好）----------
  # 【用途】把每一圈 self-check 的结论变成下一圈的硬约束。
  #   · 可疑候选      → 下一圈禁止原样/换说法/扩写重述（kind=candidate）
  #   · ing 复述=True → 下一圈 ing 必须写上游 view 没有的句子（kind=ing）
  #   · both 配额缺项 → 下一圈把缺的东西生出来、裁成 0/1（kind=dual）
  #   · 「此处未生」>3 处 → 下一圈不许再拿未生收尾（kind=any）
  #
  # 【关掉的代价】自省会照常抓到"候选凑数""ing 复述=True"，
  #   然后什么都不会发生 —— 花一次调用做质检，结论只进 md。
  #   这是 v1.21.52~v1.21.54 实测产物里的现象。
  #
  # 【为什么以前看着没生效（[P2-7] 已修）】
  #   约束原来混进 seed_probes，渲染成"上一圈没带走的自问"——
  #   一条普通探针，模型当参考看，不当约束听。
  #   现在走独立通道（Input.carry_constraints）：
  #     置顶进展开 prompt 的硬约束块，并按 kind 分流进 ing / 对偶判断。
  #   同时每圈多了【自省回流核对】：禁条目有没有重现、
  #   ing 复述率有没有降，结论进 md 的【自省回流核对】段。
  #
  # 【调试】想看注入了什么：开 output.verbose，
  #   找日志里的 "🔁 [自省回流]" 与 "✅/⚠️ [自省回流核对]"。
  carry_feedback: true


# ------------------------------------------------------------
# 螺旋停止 / 循环判据

# ------------------------------------------------------------
# [v1.21.73] 外部锚点（题外独立事实，只当校验参照）
# ------------------------------------------------------------
external_anchor:
  # 【用途】是否接入外部事实锚点。锚点是**运行前**由外部检索得到的
  #   事实快照（anchors/*.json），用来在收尾回答「这次跑出来的结论与
  #   外部事实对得上吗」。
  # 【默认】**true（v1.23.18 起）** —— 通道默认打开。
  #   没配 `path` 时是「开（未挂锚点文件）」这个**独立干净态**：零调用、
  #   不记 error；配了 `path` 才真读文件（可能多一次收尾对照调用）。
  #   显式 `false` = 完全关闭（关闭时产物不写该通道状态）。
  # 【注意】锚点**不进池、不参与对撞与清算、不改判定**。它是校验标尺，
  #   不是题面输入。想让结论更"正确"不是它的职能。
  enabled: true

  # 【用途】锚点快照 JSON 路径（相对工作目录，或绝对路径）。
  #   格式见 anchors/up_biz_anchors.json：
  #     {"question", "retrieved_at", "retriever",
  #      "anchors":[{"id","claim","source","url","as_of","kind"}]}
  # 【失败行为】读不到 / 结构不对 → 记进 external_anchor.error 并写进
  #   产物，**不静默降级**成"没接入"。
  path: ""

  # 【用途】最多用几条锚点（防 prompt 膨胀）。
  max_items: 12

  # 【用途】锚点检索后端。
  #   "snapshot" —— **零调用**：读上面 `path` 指的快照 JSON（默认）。
  #                  ★ 必须给 `path`；没给就是「开（未挂锚点文件）」那个干净态。
  #   其它取值    —— 走真检索：当前实现 `tavily`，按池内问题
  #                  （`_build_anchor_queries`）逐圈检索，结果按 queries 的
  #                  sha256 落 `cache/anchors/`，TTL 内不再打网络；需要 key
  #                  （见 `api_key_env`）。
  #                  ★ 这条**不读 `path`** —— 没有快照文件也能独立工作。
  #   未知取值    —— **抛错留痕**，不静默降级。
  # 【注】真检索此前**够不到**（`_anchor_round` 的早退条件里有「已有锚点」，
  #   而检索调用在它后面）⇒ 没挂快照文件时一次都不会发生。已修。
  retriever: "snapshot"

  # 【用途】真检索后端读 API key 的环境变量名（key 不写进本文件）。
  api_key_env: "TAVILY_API_KEY"

  # 【用途】真检索结果的缓存有效期（小时）：期内同 queries 不再打网络。
  cache_ttl_hours: 24

  # 【用途】每圈最多并入几条锚点（0 = 本圈不检索）。元层（all）不检索。
  per_round: 2

  # 【用途】锚点**分级门槛**（v1.22 引入）：tier ≤ 此值的锚点才允许进
  #   「结论 → 锚点」引用表。tier 越小越硬：
  #     1 = 一手标准/官方　2 = 权威二手　3 = 一般二手　4 = 传闻转述
  # 【建议】2 —— 网络转述（3/4）可以留痕，但不当证据。
  # 【失败行为】值不合法 → 回落 2，不静默放松成「全都进表」。
  tier_floor: 2

  # 【用途】收尾要不要做「结论 vs 锚点」只读对照（一次额外 LLM 调用）。
  crosscheck: true

  # 【用途】answers 的**最短长度**（中文字符）。短 answer 会让
  #   overlap_coef 假命中 —— 分母取 min，2 字 answer 被长 aspect
  #   包住就是 1.000。被丢弃的 answer 会写进产物头部的
  #   「锚点 answers 警告」并记在 anchors.<id>._answers_dropped。
  # 【默认】6。置 0 = 不过滤（退回 v1.22.1 行为）。
  answers_min_len: 6

  # 【用途】单条锚点 answers 的上限（防侧面对比表膨胀）。
  # 【默认】5（原硬编码值，v1.22.2 提成配置）。
  answers_max_n: 5

  # 【用途】锚点**证据资格**五档（v1.22 引入，取代旧的布尔写法）。
  #   "off"        不参与（旧 false 等价，默认）
  #   "record"     只记进产物，不进引用表
  #   "crosscheck" 只做收尾只读对照
  #   "evidence"   允许被「结论 → 锚点」引用表引用（再受 tier_floor 门控）
  #   "gate"       最高档
  # 【建议】"off" —— 打开要多花调用；想验锚点链路时逐档上调。
  # 【兼容】旧写法 as_evidence: true / false 仍认（true → "evidence"）。
  as_evidence: "gate"

  # 【用途】分诊降级（v1.22 引入）。
  #   开启后，研究层某条 undecidable 的理由若属于
  #   「信息不足 / 需外部动作 / 缺数据 / 无外部」，而池里的外部锚点
  #   **有**材料能答 → 该条降为 decidable 或 partial；
  #   理由若是「自指循环 / 无共同参照系 / 本体论判断」→ 检索无关，
  #   **保持 undecidable，不许降级**。
  # 【建议】false（默认）—— 只在这四类理由上动，且只出建议清单。
  triage: false

# ------------------------------------------------------------

# ============================================================
# [v1.23.0 W1] 核心联网（W 系列）· 基础设施。★ 默认全关，纯加性。
#   它是什么：运行时**发起**的检索。与 external_anchor（事先落盘的冻结
#   事实快照）是两件事；编号 W# 与 X# **不互换**。
#   红线：检索结果只作**参照** —— 不进 view.candidates、不进 _ing、
#   不进对撞第三者；失败走独立 logger（dgtf.websearch, propagate=False）。
# ============================================================
web_search:
  # 【用途】全局总闸。本机最优：true（a/b 已把联网作为质量项；零调用请显式改 false）。
  enabled: true

  # 【用途】检索后端（key 走环境变量，不落盘本文件）。
  # deepseek（默认；官方 /v1/tools/search 检索 + /v1/tools/fetch 抓取）
  # | tavily（可选旧后端）| snapshot（读快照，零调用）
  backend: "deepseek"
  api_key_env: "DGTF_API_KEY"

  # 【用途】单次请求超时（秒）/ 重试次数 / 线性退避基数（秒）。
  timeout_seconds: 30
  max_retries: 2
  backoff_seconds: 1.8

  # 【用途】检索结果缓存小时数（sha256 落 cache/websearch/）。
  cache_ttl_hours: 24

  # 【配额三层】每环节每圈 / 每环节全程 / 每跑总。三层都过才允许调用。
  quota:
    per_stage_round: 2
    per_stage_total: 8
    per_run_total: 30

  # 【环节授权】逐环节开关（不是全局 ON/OFF）。
  #   修行层与停止判据**默认关** —— 修行层联网会污染
  #   「输入是形状不是数据」这条宪法级特性。
  stages:
    practice_term_calibration: false
    research_decompose: true
    research_evidence: true
    research_precedent: true
    duel_arbitration: true
    meta_clean_check: true
    stop_criteria: false

    # ★ [联网全接] 30 个环节各自的开关（默认 false ⇒ 零行为差）。
    #   名字 = 环节函数名去掉前导下划线（与引擎的 stage 推断同口径）。
    #   打开某个 ⇒ 该环节的 LLM 调用会自动带上「外部参考」段；
    #   全部经 Gate（授权/三层配额/失败降级）⇒ 可控。
    #   ★ 修行层的环节**不注入**（红线：输入是形状不是数据）。
    plan_orientation: false
    plan_resources: false
    auto_plan: false
    assess_decidability: false
    re_anchor: false
    expand_pair: false
    expand_pair_merged_once: false
    dual_judge: false
    ing: false
    he: false
    decompose_normal: false
    decompose_hybrid: false
    decompose_koan: false
    decompose_from_pool: false
    probe_research: false
    probe_duel: false
    probe_meta: false
    phase_probe: false
    ask_missing_polarity: false
    self_check: false
    manifest: false
    assess_decidability_from_pool_view: false
    check_structure_saturation: false
    re_evaluate_pool: false
    settle_research: false
    decide_parallel_mode: false
    adjudicate_sub_tristate_multi: false
    tri_test_retest: false
    adjudicate_sub_tristate: false
    anchor_crosscheck: false
    check_input_sanity: false

  # 【引用授权】off / record / crosscheck / evidence / gate。
  as_evidence: "crosscheck"
  # 【tier 门】[v1.23.2] W# 进引用表的有效 tier 上限。
  #   ★ 本键在 v1.23.1 及以前**从未被读过**（审计 J 类抓出来的）。
  #   ★ 默认 3 = 与 v1.23.1 行为一致：客户端初值 3 能进表；
  #     人把某域名在 `tier_confirmed` 里确认成 4 就进不了。
  tier_floor: 3

  # 【失败降级】连续失败达到此值 → 本跑联网关闭（留痕 [W-DISABLED]）。
  auto_disable_after_failures: 3
  # 【强制放宽】true ⇒ **每圈都**对放宽表（12 个环节）放行联网，
  #   不再要求「上一圈池零增量」。实验/特需题型用；默认 false。
  relax_force: false

  # 【人工确认表】[v1.23.2] 域名 → tier。**默认空 = 零差异**。
  #   ★ 从「提案」（tier_proposal）到「生效」没有自动路径：只有人把域名
  #     写进这张表才生效。写 4（博客/论坛档）会把它挡在引用表外。
  #   例：{natcm.gov.cn: 1, zhihu.com: 4}
  tier_confirmed: {}

  # 【tier 提案】[v1.23.1 遗留2] 是否给联网结果提「建议 tier」。
  #   ★ 默认 false = 与 v1.23.0 逐字相同（零副作用）。
  #   ★ 即便 true 也只写**待审**建议：绝不改 item 的 tier、
  #     绝不进任何判定路径 —— 由人确认后才谈 tier 生效。
  tier_proposal: false

  # 【域名启发式】提案依据表：`[子串, tier]`，tier 越小越硬。
  #   未知域名保守取 3（> 默认 tier_floor 2 ⇒ 进不了引用表）。
  domain_tier_rules:
    - [".gov.cn", 1]
    - [".gov", 1]
    - [".edu", 2]
    - ["iso.org", 1]
    - ["standard", 1]
    - ["wikipedia.org", 3]
    - ["blog", 4]
    - ["forum", 4]

spiral:
  # 【用途】view 形状窗口化：> 0 ⇒ 每类只列最近 N 条（压 prompt token）。
  # 【建议】0（出厂=不限=逐字不变）；跑长螺旋想省钱可试 8。
  # 【依据】SOTA observation masking（保留最近 N、更老换结构化占位）。
  shape_limit: 8

  # ---------- 圈数控制 ----------

  # 【用途】软最大圈数：超过它才开始检查"自然安住"。
  # 【建议】2（v1.23.17：3 → 2）。
  # 【注意】soft_max 必须 < hard_max 才能触发自然安住。
  soft_max: 2

  # 【用途】硬最大圈数：体力上限，走满即截断。
  # 【建议】
  #   开发调试：4
  #   日常：8
  #   深度研究：12-15
  #   批量：6
  # 【注意】走满时 stop_reason 会写"体力耗尽...是被截断不是自然停止"。
  hard_max: 12

  # 【用途】元层额外多跑 N 圈（用于闭环清算）。
  # 【建议】1。
  # 【关闭】0。
  all_extra_rounds: 1

  # ---------- 停止判据阈值 ----------
  # 【调松（更早停）↔ 调严（跑更久）】

  # 【用途】产物相似度阈值：连续两圈 view 相似 ≥ 此值 → 自然安住。
  # 【建议】0.8。
  # 【调松】0.7（更早停）。
  # 【调严】0.9（跑更久）。
  stop_similarity: 0.7

  # 【用途】悬置稳定所需条数。
  # 【建议】2。
  # 【调松】1。【调严】3。
  stable_need: 3

  # 【用途】悬置转稳所需的连续层数。
  # 【建议】3。
  # 【调松】2（更早停）。【调严】4。
  stable_layers: 2

  # 【用途】判定"同一批"的相似度阈值。
  # 【建议】0.6。
  batch_similarity: 0.7

  # 【用途】元层闭环清算的覆盖相似度阈值。
  # 【建议】0.6。
  meta_cover_similarity: 0.7

  # 【用途】空转上限：连续 N 圈 idle 即停。
  # 【建议】2。
  # 【调松】1。【调严】3。
  idle_limit: 2

  # 【用途】每圈空转上限：连续 N 圈无新 & / 线头即停。
  # 【建议】2。
  # 【调松】1。【调严】3。
  round_idle_limit: 2

  # ---------- 新条目判据 ----------

  # 【用途】新条目相似度阈值（辅助判据）。
  # 【建议】0.55。
  # 【调松】0.7（更容易判"重复"）。【调严】0.4。
  new_item_similarity: 0.7

  # 【用途】新条目 overlap coefficient 阈值（主判据）。
  # 【说明】overlap = |A∩B| / min(|A|,|B|)，
  #         比 Jaccard 对长短不均的句子更宽容。
  # 【建议】0.55。
  new_item_overlap: 0.7

  # ---------- ★ v1.21.49 线程去重（比候选更严）----------
  # 【原因】修行/对撞层换措辞的线头被算作"新"，
  #         导致 11 圈不触发"无线头新增"。
  # 【建议】0.70 / 0.70。
  thread_new_similarity: 0.70
  thread_new_overlap: 0.70

  # ---------- 结构饱和度检查 ----------

  # 【用途】LLM 判断"是否引入新结构维度"。
  # 【建议】true。
  # 【关闭后果】无"无新维度"停止判据，研究层可能跑更久。
  structure_saturation_enabled: true

  # 【用途】每 N 圈检查一次结构饱和度。
  # 【v1.23.17 起 = 2】检查点落在第 2/4/6…圈。
  #   · 这个检查两条跑圈通道都会过（`_run_layer` / `_b_check_stop` 各一处）；
  #     但 v1.23.16 之前只有研究层把结论推进停止计数（元层判出来只打日志），
  #     v1.23.16 起 `_sat_override` 四层同等生效。
  #   · ⚠️ 历史：v1.21.48 间隔 2 ⇒ 研究层第 2 圈就停、可判定覆盖率仅 33%；
  #     v1.21.49 放宽到 3 才让研究层走到第 3 圈。本版回到 2 是**有意**的
  #     （间隔 3 时上限 4 的层最后一圈没有检查点）—— 要退回就改 3。
  # 【注意】
  #   every_n: 1 → 每圈都跑 LLM，慢
  #   every_n: 2 → 每 2 圈一次（本版出厂值）
  #   该检查额外消耗 LLM 调用（每 N 圈 1 次）。
  structure_saturation_every_n: 2   # v1.23.17：3 → 2（与出厂默认一致）


  # 【用途】连续有新增但无推进的上限。
  # 【建议】2。
  round_stall_limit: 2

  # ---------- 反向触发点：无进展 → 迁向不可判定 ----------

  # 【用途】一个子问题连续 N 圈**没有任何进展**（没被回答 / 没挂新账 /
  #   没被复确认 / 没被清偿 / 没发生分类变更），且名下挂着未清偿的账
  #   → 迁向 undecidable，账连着关成 escalated。
  # 【为什么有它】三态在真跑里是**单向漂移**的：40 份日志里 reclass 成立
  #   18 次，方向只有 und→partial / dec→partial，从无 partial→und。
  #   于是 escalation 恒为 0，而复债只在"曾被 escalation 关过账"时才能开，
  #   所以复债也恒为 0 —— 两个 0 是同一条断链的两端。
  # 【自我约束】① 没有未清偿债务就不动手（不硬造证据）；② 本圈有任何进展
  #   就清零计数；③ 仍然双向 —— 救回时复债会把账重新挂上。
  # 【债务编号只能支撑 →undecidable】硬约束在 apply_decidability_change 里。
  # 【N 取 2 的理由】N=3 时真跑 0 次触发：要么研究层每圈都在复确认
  #   （v61a —— 已把复确认剔出"进展"），要么债务第 2 圈就被清偿（v61b）
  #   —— 债务活不过 2 圈，3 圈的门槛天然够不到。
  # 【建议】2。设 0 = 关闭（退回旧行为）。
  escalate_starve_rounds: 3

  # 【用途】停止判据是「层内空转」时，不再被「还有未深入的方向」推迟。
  # 【为什么】两条判据互相矛盾：空转说的是"已经给过 ≥2 圈机会、同一批
  #   问题没消化掉"，未深入方向说的是"还有低垂果实、值得再买一圈"。
  #   空转恰恰是在说没有。
  # 【实证】86 个真跑：48 次被迫停里 14 次属推迟，被推迟掉的判据 19/33
  #   是层内空转；推迟后那一圈仍以走满收场（对撞层 5 圈自然停率 27%、
  #   元层 32%）—— 花钱买一个已经知道的结果。
  # 【建议】1（启用）。设 0 = 退回旧行为。
  no_push_when_idle: 2

  # 【用途】自动规划给的 max_calls 若低于「总圈数 × 本值」，抬到这个量。
  # 【为什么】实测平均每圈 9.6 次调用（86 个真跑），而模型给的预算常低于
  #   圈数所需 —— y61d 给 180、四层共 21 圈，实跑 191 撞线，三层写成
  #   「预算用尽」。那是主动买截断：层内还没判停就被外部掐掉。
  # 【只抬上限，不抬消耗】层内自然停照样提前收尾，预算只在真失控时拦。
  # 【建议】10。设 0 = 关闭。
  budget_per_round_floor: 10

  # 【用途】模型把 max_calls 给成「不限」（0）时，兜到「总圈数 × 本值」。
  # 【为什么】y61e 的规划就给了「不限」，后果是动态提前停在 auto 这条
  #   最常走的路径上**永远触发不到** —— 机制写了、冒烟过了，真跑里跑不到。
  #   而且模型和 cost_profile 一样无从判断该花多少（它看不见 token 账）。
  # 【系数】12 比实测每圈成本 9.6 高 ~25%：正常跑碰不到，只在真失控时拦。
  #   是安全网，不是节流阀。
  # 【建议】12。设 0 = 关闭（允许不限）。用户显式传 0 的语义不受影响。
  budget_per_round_cap: 12

  # ---------- 入池挡重复 ----------

  # 【用途】入池前挡重复的相似度阈值。
  # 【建议】0.6 ~ 0.7。
  # 【⚠️ 太低会误杀】0.3 → 稍有相似就判"翻回老地方"，池永远长不大。
  rehash_similarity: 0.7

  # ---------- 双通道停滞 ----------

  # 【用途】双通道停滞判据：qdist 无改善连续 N 次。
  # 【建议】2。
  stall_streak_limit: 2

  # 【用途】qdist 最小改善量。
  # 【建议】0.03。
  min_distance_improvement: 0.03

  # 【用途】双通道收敛窗口。
  # 【建议】2。
  convergence_window: 2

  # ---------- ★ v1.21.55 「此处未生」阈值 ----------
  # 【用途】一圈的产物里，「此处未生」出现超过几处就判为**逃避**。
  #   「此处未生」是宪法允许的诚实姿态（折中不合法，未生合法）。
  #   但每次都拿它收尾就成了套路：探针没真的往里推，
  #   用一句「未生」把该走的路结掉。这个字段就是那条分界线。
  #
  # 【统计口径】代码按产物硬数一遍（ing / view / 线头 / & /
  #   不可判定通道），与模型自报的 unsaid_count 取**较大值**——
  #   模型靠少报藏不住。
  #
  # 【建议】3。
  #   调大（4~6）→ 更宽容，适合本来就难推的问题（如不可判定类）
  #   调小（1~2）→ 更严，适合要逼出实际产物的场景
  #   0         → 不设限，永远只当诚实姿态，不做判据
  #
  # 【触发后发生什么】
  #   quality_flags 加 unsaid_overused(n)（进质量评价）
  #   self_check.unsaid_is_escape = true
  #   下一圈注入一条硬约束：「不许再拿未生收尾，
  #     先把上一圈标了未生的地方真的推一遍」
  #
  # 【按层覆盖】per_entry."0".unsaid_escape_limit: 5
  #   例：修行层本来就常以「未生」收尾，可以只对它放宽。
  #
  # 【看结果】md 每段末尾的【「此处未生」计数】。
  unsaid_escape_limit: 2

  # ---------- ★ v1.21.56 · 两条 both 阈值（语义完全不同）----------

  # 【用途】展开后处理里 both 占比超过它 → 把多余的按两端理由长度
  #         对称性**改判**回 0/1。
  # 【建议】0.3。
  # ⚠️ 它和 spiral.both_quota.max_ratio（默认 0.7）不是同一个东西：
  #    both_tighten_ratio = 改判阈值（动极性）
  #    both_quota.max_ratio = 追问阈值（不动极性，只追问「缺什么」）
  #    v1.21.56 以前，0.3 是写死在调用处的，读代码的人容易以为
  #    0.7 是唯一的 both 配额。
  both_tighten_ratio: 0.5

  # ---------- ★ v122 · both 配额（**追问**，不动极性）----------

  # 【用途】both 占比超过 max_ratio → 去问「缺什么」，把答案挂进
  #   view.both_quota.missing，下一圈据此要求把缺的东西生出来。
  # 【建议】max_ratio 0.7 / min_items 2（条数太少不判占比）。
  # 【关闭】enabled: false → 不追问（both 占比再高也不补裁）。
  # ⚠️ 上面 both_tighten_ratio 是**改判**（动极性），这里才是**追问**，
  #    两条阈值语义完全不同，别混。
  both_quota:
    enabled: true
    max_ratio: 0.7
    min_items: 2

  # ---------- ★ [AMP 窗口] 候选占比上限（与 DEFAULT_CONFIG 同步）----------
  # 默认值与旧硬编码一致：0/1/all 层 0.75，both 层 0.65。
  amp_ratio_max: 0.75
  amp_ratio_max_by_entry:
    "0": 0.75
    "1": 0.75
    both: 0.65
    all: 0.75

  # ---------- ★ v1.21.56 · 四象限对齐的两条判据 ----------

  # 【用途】修行层的悬置 target × 研究层的 sub_question 配对的相似度。
  # 【说明】分母取两侧关键词数的**最大值**，所以短 target 对长问句
  #         几乎永远上不去 0.7——实测 10 份产物匹配率全是 0%。
  # 【建议】0.7。
  alignment_similarity: 0.7

  # 【用途】包含度判据：短的一侧有多少关键词落在长的那一侧里。
  # 【说明】这是 v1.21.56 补的第二条判据，专门救「短 target × 长问句」。
  # 【建议】0.6。调松到 0.5 会更容易配上，也更容易误配。
  # ⚠️ 未对齐仍然是**合法结果**（宪法级）。这两条只决定"能不能对上"，
  #    不决定"该不该对上"——真的没有同一件事可对时，产物仍写
  #    unaligned，只是现在它「有可能」对上，且会打印两侧各几条、
  #    最接近的一对几分，让 0% 变得可解释。
  alignment_containment: 0.7

  # ---------- ★ v1.21.56 配置化 · 合并后二次去重 ----------

  # 候选更怕误杀，& 和线头更容易近义改写（同一件事换三种说法）。
  # 【调松（更多去重）】候选 0.55/0.60；&/线头 0.55/0.58。
  # 【调严（更多保留）】候选 0.75/0.80；&/线头 0.65/0.68。
  dedup_candidate_overlap: 0.7
  dedup_candidate_similarity: 0.70
  dedup_amp_overlap: 0.7
  dedup_amp_similarity: 0.7

  # ---------- ★ v1.21.56 配置化 · 质量线索触发线 ----------

  # 【用途】ing 复述率超过它 → 挂 ing_rephrased_direct 质量线索。
  # 【建议】0.5。【调严】0.4（更敏感）。【调松】0.6。
  qc_rephrase_ratio: 0.7

  # 【用途】候选极性 both 占比超过它 → 挂 judge_mostly_both。
  # 【建议】0.6。【调严】0.5。
  qc_both_ratio: 0.7

  # ---------- ★ [v1.31 结构复检] 立场同构 → 一次带提示重采样 ----------

  # 【用途】候选 position 全同、且 why_position 的论据类型单一（或句式
  #   模板重复率 ≥ 0.8）时，带「按证据逐条重判」提示再判一次。
  # ★ 只重试、不改判定：quality flag 规则不变；重采样后结构没变多样
  #   就保留原判，只留痕（view.structural_resample / structural_diversity）。
  # 【建议】true（只在命中时多一次调用）；false 则只记录提示、不重采样。
  structural_resample: true

  # 【用途】每层最多重采样几次。按层计（pool 跨圈复用）。
  # 【建议】1。【关闭】0（只提示不重采样）。
  structural_resample_max: 1

  # ---------- ★ v1.21.56 配置化 · all 层漂移/自指标记 ----------

  # 【用途】all 层候选里跨层描述占比超过它 → all_candidate_drift。
  # 【建议】0.5。
  all_drift_threshold: 0.7

  # 【用途】all 层候选里本层自指占比超过它 → all_candidate_selfref。
  # 【建议】0.4。
  all_selfref_threshold: 0.7

  # ---------- 极性重估 ----------

  # 【用途】极性重估频率（每 N 圈跑一次）。
  # 【建议】1（每圈）。
  # 【关闭】配合 actions.re_evaluate_pool: false。
  re_eval_every_n: 1

  # 【用途】极性重估取池尾几条。
  # 【建议】10。
  re_eval_recent_k: 10

  # ---------- 每层最低圈数 ----------
  # 【用途】低于此值不允许停止（拦截早停）。
  # 【⚠️ 注意】会覆盖停止判据：
  #   即使"材料耗尽"命中，圈数未到 min_rounds 也不会停。
  # 【v1.21.58 起全层归零】
  #   · 它想防的「研究层 2 圈就停」已由 structure_saturation_every_n: 3
  #     解决，数值下限与那个机制叠着，反而多一处看不见的行为来源。
  #   · 各层停止理由自身都带累计门槛（复述 / 自省点名 / 无新 & 都要
  #     累计 >= 2 圈），第 1 圈不可能产生任何理由 —— 下限 2 只能拦
  #     "第 1 圈停止"，而那件事本来就不会发生（v1.21.57 复查结论）。
  #   · 元层真正的下限是**语义下限**「闭环未清算→推迟停止」，不看圈号。
  # 【想按层加】运行时用 spiral.per_entry（见下方说明），别写回这里。
  min_rounds:
    "0": 0
    "1": 0
  #             ↑ 原为过期值 2；v1.21.58 起「全层归零」，yaml 因语法错误从未生效，首次生效前对齐（v1.21.60）
    "both": 0
    "all": 0

  # ---------- 按层覆盖（可选，默认不启用） ----------
  # 【v1.21.58 起这里**默认留空**】—— 出厂是全层一致
  #   （soft_max 3 / hard_max 12），按层差异一律走运行时，三条路：
  #
  #   1) 命令行（最常用，只管预算）
  #        --rounds "0:4,both:6"        # 只写想改的层，其余用 hard_max
  #        --rounds 3                   # 全层同圈数
  #        --rounds 0                   # 全层用 hard_max（默认）
  #   2) 交互式（不给参数时问）
  #        圈数 [0=用 hard_max]> 0:2,1:2,both:3,all:3
  #   3) 配置文件（要改的**不只是预算**时，临时加这一段）
  # spiral:
  # per_entry:
  # "both": { soft_max: 3, hard_max: 6 }
  # "all":  { stable_layers: 2 }
  #
  # 【⚠️ per_entry 是浅合并，不是整体替换】未列出的字段仍从顶层继承：
  #     sp = dict(config["spiral"]); sp.update(per_entry[entry])
  #   所以要完全隔离某层，得把该层所有要覆盖的字段都写出来。
  #
  # 【⚠️ 预算必须 > soft_max】否则「自然安住」永远触发不了
  #   （旧默认预算 3 而对撞层 soft_max 5，那条判据一直是死的）。
  #
  # ---------- 显式恢复 v1.21.57 之前的元层行为 ----------
  # v1.21.58 去 per_entry 时，元层的 stable_layers 从 2 提到了全局 3。
  # 这**不是打字错误，是行为变化**：元层「悬置决定稳定 → 自然安住」
  # 的门槛提高，自然安住更难触发，元层会跑更久。
  # 想要回原来那样（门槛 2），把下面这段取消注释即可：
  #
  # spiral:
  # per_entry:
  # "all": { stable_layers: 2 }
  #
  # 另外两个同样可在运行时恢复的旧值（v1.21.58 统一掉了）：
  #   · 对撞层的 soft_max 5（旧值）：
  #       spiral:
  #         per_entry:
  #           "both": { soft_max: 5 }
  #     注意同时要保证该层预算 > 5，否则那条判据是死的（见上面的 ⚠️）。
  #   · 按层加「最低圈数」下限（旧值：研究 2 / 对撞 3）：
  #       spiral:
  #         per_entry:
  #           "1":    { min_rounds: { "1": 2 } }      # 注意 min_rounds 是
  #           "both": { min_rounds: { "both": 3 } }   # **字典**，不是标量；
  #     而且 per_entry 是浅合并，写它会**整块替换**顶层的 min_rounds，
  #     所以要把该层那一条写全。写错了个数是静默失效，不报错。


# ============================================================
# 三套推荐配置（按需切换）
# ============================================================
#
# 【场景 1 · 开发调试】
#   想快速定位问题，用便宜模型，跑得短。
#   ------------------------------------------------------------
#   api:
#     reasoner_model: "deepseek-chat"      # 调试时用便宜模型
#   output:
#     verbose: true
#     show_dual_judge: true
#     show_ing: true
#     show_manifest: true
#     show_probe_diag: true
#   actions:
#     parallel_mode: "serial"              # 调试用串行，好定位
#   spiral:
#     hard_max: 4                          # 全层统一，短平快
#   # 命令行覆盖：--rounds 2  或  --rounds "0:2,both:3"
#
# ------------------------------------------------------------
# 【场景 2 · 日常使用】
#   平衡速度与质量。
#   ------------------------------------------------------------
#   actions:
#     parallel_mode: "auto"
#   output:
#     verbose: true
#     self_check: true
#   spiral:
#     hard_max: 8                          # 全层统一
#   # 想让某层多跑：命令行 --rounds "both:10,all:8"
#
# ------------------------------------------------------------
# 【场景 3 · 批量生产】
#   多问题并行，最省成本，最安静。
#   ------------------------------------------------------------
#   output:
#     verbose: false
#     self_check: false                    # 省 1 次/圈
#   actions:
#     parallel_mode: "C"                   # 最快（A 也可，见下）
#     re_evaluate_pool: false              # 省 1 次/圈
#   spiral:
#     hard_max: 4                          # 压低预算（全层统一）
#     all_extra_rounds: 0
#
#   A 与 C 的取舍：
#     A —— 四层互不相干地跑完再汇流，结果确定，但 both/all 的
#          "读上游"语义是退化后靠汇流圈补回来的。
#     C —— 每层真的在读上游（部分受限地保留了 both/all 语义），
#          也最快，但结果带时序依赖，跑两次可能不一样。
#     批量且不需要复现 → C；批量但要能对着上一版复盘 → A。
#
# ============================================================


# ============================================================
# 调试与诊断速查
# ============================================================
#
# 【想知道为什么停止了】
#   看 outputs/*.md 里的 **螺旋停止** 字段，
#   或日志里的 ⏹ 螺旋停止（第 N 圈）。
#   停止理由可能是多条拼起来的：
#     "产物相似度高，自然安住 + 连续 2 轮无新 &"
#   排查顺序：
#     1. 看 round_log 表格，找到哪一圈先触发
#     2. 对比 idle_amp / idle_thread / idle_stall 是否超阈值
#     3. 若"产物相似" → 调 stop_similarity
#     4. 若"无新 &"  → 调 new_item_overlap
#
# 【想看探针为什么没 covers】
#   output.show_probe_diag: true
#   日志会出现：
#     [fix-89 diag] 探针 covers_raw=['T1','T3'] → parsed=['T1','T3']
#   或：
#     [fix-89 diag] 探针 covers 字段缺失（模型未输出）
#
# 【想看 ing 复述率】
#   默认不打印。看 view.quality_flags：
#     ing_rephrased_direct(75%)
#   百分数是复述率。若 ≥ 50%，_ing_rephrase_ratio 被设置。
#
# 【想看池极性分布】
#   每次跑池快照会打印：
#     📋 池极性快照（1 第 3 圈，共 12 条，未判 2 条）：
#           & [1] 前端设计的责任边界
#           & [0] 验证环节的归属
#           ... [both] 需求到实现的转换
#   [?] 是未判的，re_evaluate_pool: true 后会补上。
#
# 【想看某个动作的开销】
#   output.verbose: true
#   跑完后会打印：
#     完成 | 87 次 LLM | 132456 tokens
#   单层单圈约 10 次 LLM：
#     re_anchor        1 次
#     expand_yin/yang  2 次
#     dual_judge       1-3 次
#     ing              1 次（reasoner）
#     he               1 次
#     phase_probe      1 次
#     manifest         1 次（reasoner）
#     self_check       1 次
#     re_evaluate_pool 1 次
#     结构饱和度        1 次/N 圈
#
# ============================================================


# ============================================================
# 常见坑与陷阱（速查表）
# ============================================================
#
# 【坑 1】--parallel 默认值覆盖 YAML（v1.21.51 [fix-105] 已修）
#   现象（旧版）：YAML 里写 parallel_mode: "A"，CLI 不传 --parallel，
#               实际跑的是 "auto"。
#   原因：argparse default="auto" 硬编码。
#   现状：default 改成 None，不传就回落本文件的 parallel_mode。
#   仍然要注意：显式传 --parallel 会覆盖本文件（这是想要的）。
#
# 【坑 1.5】C 模式结果不可复现
#   现象：同一个问题跑两遍，both/all 的产物不一样。
#   原因：C 是流水线，both 的第 2 圈读到 0 的第几圈取决于谁先跑完。
#   想可复现 → 用 B（每圈 barrier）或 serial。
#   想最快 → 用 C。两者不能兼得。
#
# 【坑 2】per_entry 是浅合并
#   现象：per_entry."1".structure_saturation_every_n: 3
#         期望 "1" 层完全隔离配置，
#         实际 hard_max 仍继承顶层 12。
#   修法：把该层所有要覆盖的字段都写出来。
#
# 【坑 3】A 模式强制走 external（B~H 已不用强制了）
#   现象：decidability_source: "pool" 配了，A 模式实际走 external。
#   原因：A 模式四层互不读产物，池里没有东西可读。
#   修法：设计如此，A 模式本来就不继承。
#
#   B/C/D/E/F/G/H 模式不同 —— v1.21.53 加了 0 层预热之后
#   它们都能走池路径（_source = pool+external）。
#   但预热圈数决定这条路走不走得成：
#     parallel_warmup_rounds = 0   → 退回 external
#     parallel_warmup_rounds >= 1  → 走池路径 ✅
#   所以看到 B~H 的判定源是 external 时，先查这个字段。
# 【坑 4】self_check: false 会让 fix-72 失效
#   现象：对撞/元层跑得比预期久。
#   原因：_rephrased_streak / meta_idle_streak 不累积，
#         fix-72 v3 不再触发。
#   修法：除非调试速度，保持 self_check: true。
#   v1.21.55 起还多一条：self_check 关掉 → _build_carry 没有输入，
#         memory.carry_feedback 形同虚设（自省结论不再回流）。
#         两个开关是串在同一条链上的。
#
# 【坑 5】rehash_similarity 太低会误杀
#   现象：池永远长不大，每次都"翻回老地方"。
#   原因：0.3 太低，稍有相似就判重复。
#   修法：保持 0.6 ~ 0.7。
#
# 【坑 6】min_rounds 会覆盖停止判据
#   现象：即使"材料耗尽"命中，层仍继续跑。
#   原因：min_rounds 拦截早停。
#   修法：默认全 0；确实需要最低圈数的层再设。
#
# 【坑 7】批量跑时共享 LLM 实例
#   现象：无法区分哪个问题花了多少 LLM 调用。
#   原因：多 Meta-DGTF 共享一个 LLM，计数累加正确但无归属。
#   修法：每个问题用独立 Meta-DGTF（默认行为）。
#
# ============================================================


