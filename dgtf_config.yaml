#         off / record / crosscheck / evidence / gate
#         （旧写法 true / false 仍认，true → "evidence"，兼容一版）
#     external_anchor.retriever: "snapshot"
#         "snapshot" = 零调用读快照；其它值走真检索（当前实现 tavily，
#         结果按 queries 的 sha256 落 cache/anchors/，TTL 内不打网络）；
