#      随圈数上涨（真跑实测最贵调用 25–32k tok/次；最贵 20% 占 46.5% token）。
#   ② 修法（SOTA observation masking：保留最近 N、更老换结构化占位，成本↓52%）：
#      shape_of 增加 limit 形参（默认 0=不限）；limit>0 只列最近 N 条 + 表头标总数。
#   ③ 新键 spiral.shape_limit：**默认 0 = 不限 ⇒ 逐字零行为差**；>0 才裁剪。
